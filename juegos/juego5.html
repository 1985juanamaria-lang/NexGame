<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - aldGAME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Panel Lateral */
        .panel-lateral {
            width: 320px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        .panel-lateral h2 {
            font-size: 1.4rem;
            color: #e94560;
            margin-bottom: 6px;
        }

        .info-estado {
            font-size: 0.9rem;
            background: #2b2b2b;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #444;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .puntuacion-contenedor {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .caja-puntos {
            background: #252525;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }

        .caja-puntos span {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .caja-puntos strong {
            font-size: 1.2rem;
            color: #e94560;
        }

        /* Historial de Partidas */
        .seccion-historial {
            background-color: #252525;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            max-height: 130px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .seccion-historial h3 {
            font-size: 0.85rem;
            color: #e94560;
            margin-bottom: 4px;
            text-align: center;
        }

        .lista-partidas {
            list-style: none;
            font-size: 0.75rem;
        }

        .lista-partidas li {
            padding: 3px 5px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .lista-partidas li:last-child {
            border-bottom: none;
        }

        .tag-puntos { color: #2ecc71; font-weight: bold; }

        /* Contenedor principal del juego */
        .contenedor-juego {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 15px;
        }

        /* Tablero de Tetris Grande (Ocupa gran parte de la pantalla) */
        .tablero-tetris {
            width: 400px;
            height: 800px;
            background-color: #181818;
            border: 3px solid #0f3460;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .celda-tetris {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Botones */
        .botones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #cf3a53;
        }

        .btn-volver {
            background-color: #444;
        }

        .btn-volver:hover {
            background-color: #555;
        }
    </style>
<style id="nexgame-theme">
/* ===== NexGame · tema común ===== */
:root{--nx-bg:#0b0d12;--nx-surface:#12151c;--nx-surface2:#181c25;--nx-line:#232836;--nx-text:#e8eaf0;--nx-muted:#8b92a5;--nx-accent:#ff4757;--nx-ok:#35d07f;--nx-bad:#ff5c6c;--nx-warn:#f5c451}
body{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif !important;background:var(--nx-bg) !important;color:var(--nx-text) !important;-webkit-font-smoothing:antialiased}
.panel-lateral{width:300px;background:var(--nx-surface);border-right:1px solid var(--nx-line);padding:26px 20px}
.panel-lateral h2{font-size:1.2rem;font-weight:700;color:var(--nx-text);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--nx-line);letter-spacing:.2px}
.panel-lateral h2::before{content:'NEXGAME';display:block;font-size:.62rem;letter-spacing:3px;color:var(--nx-accent);font-weight:800;margin-bottom:7px}
.info-estado,.info-turno{background:var(--nx-surface2);border:1px solid var(--nx-line);border-radius:10px;padding:12px 14px;font-size:.88rem;font-weight:600;color:var(--nx-text);line-height:1.35}
.puntuacion-contenedor{gap:10px}
.caja-puntos,.caja-saldo,.selector-apuesta{background:var(--nx-surface2);border:1px solid var(--nx-line);border-radius:10px}
.caja-puntos span,.caja-saldo span,.selector-apuesta span{color:var(--nx-muted);font-size:.64rem;letter-spacing:1.4px;font-weight:700}
.caja-puntos strong,.caja-saldo strong{color:var(--nx-text);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.caja-saldo strong{color:var(--nx-warn)}
.seccion-historial{background:var(--nx-surface2);border:1px solid var(--nx-line);border-radius:10px;padding:12px}
.seccion-historial h3{color:var(--nx-muted);font-size:.64rem;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;margin-bottom:8px;text-align:left}
.lista-partidas li{border-bottom:1px solid var(--nx-line);padding:7px 2px;color:var(--nx-muted)}
.tag-victoria,.tag-ganada{color:var(--nx-ok) !important}.tag-derrota,.tag-perdida{color:var(--nx-bad) !important}.tag-empate{color:var(--nx-warn) !important}.tag-puntos{color:var(--nx-text) !important}
.btn{background:var(--nx-accent);color:#fff;border:1px solid transparent;border-radius:10px;padding:12px 16px;font-size:.9rem;font-weight:600;letter-spacing:.2px;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:#ff6070}.btn:active{transform:translateY(1px)}
.btn-volver,.btn-secundario{background:transparent !important;border:1px solid var(--nx-line) !important;color:var(--nx-muted) !important}
.btn-volver:hover,.btn-secundario:hover{border-color:#3a4258 !important;color:var(--nx-text) !important;background:var(--nx-surface2) !important}
.btn:disabled{background:#262b38;color:#6b7387}
.contenedor-juego{background:radial-gradient(800px 500px at 50% 0%,#141826 0%,transparent 70%)}

.tablero-tetris{--h:min(calc(100vh - 56px),780px);height:var(--h);width:calc(var(--h) / 2);background:#0d1018;border:1px solid var(--nx-line);border-radius:12px;box-shadow:0 0 0 6px #151925,0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.celda-tetris{border:1px solid rgba(255,255,255,.035)}
</style>
</head>
<body>

    <!-- Panel Lateral -->
    <div class="panel-lateral">
        <div>
            <h2>Tetris aldGAME</h2>
            <div class="info-estado" id="info-estado">¡Usa las flechas para jugar!</div>

            <div class="puntuacion-contenedor">
                <div class="caja-puntos">
                    <span>Puntuación</span>
                    <strong id="puntuacion">0</strong>
                </div>
                <div class="caja-puntos">
                    <span>Paleta Actual</span>
                    <strong id="nombre-paleta" style="font-size: 0.95rem; color: #fff;">Neón Clásico</strong>
                </div>
            </div>

            <!-- Historial de las 10 últimas partidas -->
            <div class="seccion-historial">
                <h3>Últimas Partidas</h3>
                <ul class="lista-partidas" id="lista-historial">
                    <!-- Se llena dinámicamente -->
                </ul>
            </div>
        </div>

        <div class="botones">
            <button class="btn" onclick="reiniciarJuego()">Reiniciar Partida</button>
            <a href="../index.html" class="btn btn-volver">Volver al Menú</a>
        </div>
    </div>

    <!-- Contenedor del Juego -->
    <div class="contenedor-juego">
        <div class="tablero-tetris" id="tablero">
            <!-- Celdas generadas por JS (20x10) -->
        </div>
    </div>

    <script>
        const ANCHO = 10;
        const ALTO = 20;
        let tablero = Array.from({ length: ALTO }, () => Array(ANCHO).fill(0));
        let puntuacion = 0;
        let juegoTerminado = false;
        let intervaloJuego = null;

        // Paletas de color que cambian cada 100 puntos
        const paletas = [
            { nombre: "Neón Clásico", colores: ['', '#00f0f0', '#0000f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000'] },
            { nombre: "Cyberpunk", colores: ['', '#ff007f', '#00ffcc', '#ff9900', '#ffff00', '#9900ff', '#00ffff', '#ff0033'] },
            { nombre: "Sunset Retro", colores: ['', '#ff4b5c', '#ff6b6b', '#ffa502', '#fffa65', '#2ed573', '#3742fa', '#70a1ff'] },
            { nombre: "Matrix Code", colores: ['', '#00ff66', '#00cc44', '#009933', '#00ffcc', '#33ff99', '#66ffcc', '#00ff33'] },
            { nombre: "Candy Pop", colores: ['', '#ff9ff3', '#feca57', '#ff6b6b', '#48dbfb', '#1dd1a1', '#5f27cd', '#ff9f43'] }
        ];

        let paletaActualIndex = 0;

        const tetrominos = [
            [],
            [[1,1,1,1]], // I
            [[2,0,0],[2,2,2]], // J
            [[0,0,3],[3,3,3]], // L
            [[4,4],[4,4]], // O
            [[0,5,5],[5,5,0]], // S
            [[0,6,0],[6,6,6]], // T
            [[7,7,0],[0,7,7]]  // Z
        ];

        let piezaActual = {
            forma: null,
            tipo: 0,
            x: 0,
            y: 0
        };

        function iniciarJuego() {
            tablero = Array.from({ length: ALTO }, () => Array(ANCHO).fill(0));
            puntuacion = 0;
            juegoTerminado = false;
            paletaActualIndex = 0;
            document.getElementById('puntuacion').textContent = puntuacion;
            document.getElementById('nombre-paleta').textContent = paletas[0].nombre;
            document.getElementById('info-estado').textContent = "¡A jugar!";
            
            crearEstructuraTableroUI();
            generarNuevaPieza();

            if (intervaloJuego) clearInterval(intervaloJuego);
            intervaloJuego = setInterval(bajarPieza, 500);
        }

        function crearEstructuraTableroUI() {
            const tableroEl = document.getElementById('tablero');
            tableroEl.innerHTML = '';
            for (let r = 0; r < ALTO; r++) {
                for (let c = 0; c < ANCHO; c++) {
                    const celda = document.createElement('div');
                    celda.classList.add('celda-tetris');
                    celda.id = `celda-${r}-${c}`;
                    tableroEl.appendChild(celda);
                }
            }
        }

        function generarNuevaPieza() {
            const tipoAleatorio = Math.floor(Math.random() * 7) + 1;
            piezaActual.tipo = tipoAleatorio;
            piezaActual.forma = tetrominos[tipoAleatorio];
            piezaActual.x = Math.floor(ANCHO / 2) - Math.floor(piezaActual.forma[0].length / 2);
            piezaActual.y = 0;

            if (verificarColision(piezaActual.x, piezaActual.y, piezaActual.forma)) {
                juegoTerminado = true;
                clearInterval(intervaloJuego);
                document.getElementById('info-estado').textContent = "¡Juego Terminado! 🤖";
                registrarPartida(puntuacion);
            }
        }

        function verificarColision(px, py, forma) {
            for (let r = 0; r < forma.length; r++) {
                for (let c = 0; c < forma[r].length; c++) {
                    if (forma[r][c] !== 0) {
                        let nuevoX = px + c;
                        let nuevoY = py + r;
                        if (nuevoX < 0 || nuevoX >= ANCHO || nuevoY >= ALTO) return true;
                        if (nuevoY >= 0 && tablero[nuevoY][nuevoX] !== 0) return true;
                    }
                }
            }
            return false;
        }

        function fijarPieza() {
            for (let r = 0; r < piezaActual.forma.length; r++) {
                for (let c = 0; c < piezaActual.forma[r].length; c++) {
                    if (piezaActual.forma[r][c] !== 0) {
                        let ty = piezaActual.y + r;
                        let tx = piezaActual.x + c;
                        if (ty >= 0) {
                            tablero[ty][tx] = piezaActual.tipo;
                        }
                    }
                }
            }
            eliminarLineasCompletas();
            generarNuevaPieza();
        }

        function eliminarLineasCompletas() {
            let lineasEliminadas = 0;
            for (let r = ALTO - 1; r >= 0; r--) {
                if (tablero[r].every(celda => celda !== 0)) {
                    tablero.splice(r, 1);
                    tablero.unshift(Array(ANCHO).fill(0));
                    lineasEliminadas++;
                    r++;
                }
            }

            if (lineasEliminadas > 0) {
                let puntosGanados = lineasEliminadas * 25;
                sumarPuntuacion(puntosGanados);
            }
        }

        function sumarPuntuacion(puntos) {
            let puntuacionAnterior = puntuacion;
            puntuacion += puntos;
            document.getElementById('puntuacion').textContent = puntuacion;

            let bloqueActual100 = Math.floor(puntuacion / 100);
            let bloqueAnterior100 = Math.floor(puntuacionAnterior / 100);

            if (bloqueActual100 > bloqueAnterior100) {
                paletaActualIndex = (paletaActualIndex + 1) % paletas.length;
                document.getElementById('nombre-paleta').textContent = paletas[paletaActualIndex].nombre;
            }
        }

        function bajarPieza() {
            if (juegoTerminado) return;
            if (!verificarColision(piezaActual.x, piezaActual.y + 1, piezaActual.forma)) {
                piezaActual.y++;
            } else {
                fijarPieza();
            }
            actualizarTableroUI();
        }

        function moverLateral(dir) {
            if (juegoTerminado) return;
            if (!verificarColision(piezaActual.x + dir, piezaActual.y, piezaActual.forma)) {
                piezaActual.x += dir;
                actualizarTableroUI();
            }
        }

        function rotarPieza() {
            if (juegoTerminado) return;
            let formaRotada = piezaActual.forma[0].map((_, index) =>
                piezaActual.forma.map(fila => fila[index]).reverse()
            );
            if (!verificarColision(piezaActual.x, piezaActual.y, formaRotada)) {
                piezaActual.forma = formaRotada;
                actualizarTableroUI();
            }
        }

        function actualizarTableroUI() {
            let coloresActivos = paletas[paletaActualIndex].colores;

            for (let r = 0; r < ALTO; r++) {
                for (let c = 0; c < ANCHO; c++) {
                    const celdaEl = document.getElementById(`celda-${r}-${c}`);
                    let valor = tablero[r][c];
                    if (valor !== 0) {
                        celdaEl.style.backgroundColor = coloresActivos[valor];
                    } else {
                        celdaEl.style.backgroundColor = '';
                    }
                }
            }

            if (piezaActual.forma) {
                for (let r = 0; r < piezaActual.forma.length; r++) {
                    for (let c = 0; c < piezaActual.forma[r].length; c++) {
                        if (piezaActual.forma[r][c] !== 0) {
                            let ty = piezaActual.y + r;
                            let tx = piezaActual.x + c;
                            if (ty >= 0 && ty < ALTO && tx >= 0 && tx < ANCHO) {
                                const celdaEl = document.getElementById(`celda-${ty}-${tx}`);
                                celdaEl.style.backgroundColor = coloresActivos[piezaActual.tipo];
                            }
                        }
                    }
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (juegoTerminado) return;
            if (e.key === "ArrowLeft") moverLateral(-1);
            else if (e.key === "ArrowRight") moverLateral(1);
            else if (e.key === "ArrowDown") bajarPieza();
            else if (e.key === "ArrowUp") rotarPieza();
        });

        function reiniciarJuego() {
            if (puntuacion > 0 && !juegoTerminado) {
                registrarPartida(puntuacion);
            }
            if (intervaloJuego) clearInterval(intervaloJuego);
            iniciarJuego();
        }

        function registrarPartida(puntosFinales) {
            let historial = JSON.parse(localStorage.getItem('tetris_historial')) || [];
            const fecha = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            historial.unshift({ puntos: puntosFinales, fecha });

            if (historial.length > 10) historial.pop();

            localStorage.setItem('tetris_historial', JSON.stringify(historial));
            actualizarHistorialUI();
        }

        function actualizarHistorialUI() {
            const listaEl = document.getElementById('lista-historial');
            listaEl.innerHTML = '';
            let historial = JSON.parse(localStorage.getItem('tetris_historial')) || [];

            if (historial.length === 0) {
                listaEl.innerHTML = `<li style="color: #777; text-align: center;">Sin partidas aún</li>`;
                return;
            }

            historial.forEach(item => {
                const elementoLi = document.createElement('li');
                elementoLi.innerHTML = `<span>${item.fecha}</span> <span class="tag-puntos">${item.puntos} pts</span>`;
                listaEl.appendChild(elementoLi);
            });
        }

        iniciarJuego();
        actualizarHistorialUI();
    </script>
</body>
</html>
