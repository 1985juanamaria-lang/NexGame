<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 - aldGAME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Panel Lateral */
        .panel-lateral {
            width: 320px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        .panel-lateral h2 {
            font-size: 1.4rem;
            color: #e94560;
            margin-bottom: 8px;
        }

        .info-estado {
            font-size: 0.95rem;
            background: #2b2b2b;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .puntuacion-contenedor {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .caja-puntos {
            flex: 1;
            background: #252525;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }

        .caja-puntos span {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .caja-puntos strong {
            font-size: 1.2rem;
            color: #e94560;
        }

        /* Historial de Partidas */
        .seccion-historial {
            background-color: #252525;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 12px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .seccion-historial h3 {
            font-size: 0.9rem;
            color: #e94560;
            margin-bottom: 4px;
            text-align: center;
        }

        .lista-partidas {
            list-style: none;
            font-size: 0.8rem;
        }

        .lista-partidas li {
            padding: 4px 6px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .lista-partidas li:last-child {
            border-bottom: none;
        }

        .tag-puntos { color: #2ecc71; font-weight: bold; }

        /* Contenedor principal del juego */
        .contenedor-juego {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* Tablero 2048 */
        .tablero-2048 {
            width: 400px;
            height: 400px;
            background-color: #bbada0;
            border-radius: 10px;
            padding: 15px;
            position: relative;
        }

        .grid-fondo {
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            z-index: 1;
        }

        .celda-vacia {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
        }

        .capa-fichas {
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            z-index: 2;
            pointer-events: none;
        }

        .ficha {
            position: absolute;
            width: calc((100% - 45px) / 4);
            height: calc((100% - 45px) / 4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            user-select: none;
            transition: transform 0.12s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .ficha.fusionada {
            animation: pop 0.15s ease-in-out;
        }

        /* Colores estándar 2048 */
        .f-2 { background-color: #eee4da; color: #776e65; }
        .f-4 { background-color: #ede0c8; color: #776e65; }
        .f-8 { background-color: #f2b179; color: #f9f6f2; }
        .f-16 { background-color: #f59563; color: #f9f6f2; }
        .f-32 { background-color: #f67c5f; color: #f9f6f2; }
        .f-64 { background-color: #f65e3b; color: #f9f6f2; }
        .f-128 { background-color: #edcf72; color: #f9f6f2; font-size: 1.5rem; }
        .f-256 { background-color: #edcc61; color: #f9f6f2; font-size: 1.5rem; }
        .f-512 { background-color: #edc850; color: #f9f6f2; font-size: 1.5rem; }
        .f-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 1.2rem; }
        .f-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 1.2rem; }
        .f-mas { background-color: #3c3a32; color: #f9f6f2; font-size: 1rem; }

        /* Botones */
        .botones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn:hover { background-color: #cf3a53; }
        .btn-volver { background-color: #444; }
        .btn-volver:hover { background-color: #555; }
    </style>
<style id="nexgame-theme">
:root{--nx-bg:#0b0d12;--nx-surface:#12151c;--nx-surface2:#181c25;--nx-line:#232836;--nx-text:#e8eaf0;--nx-muted:#8b92a5;--nx-accent:#ff4757;--nx-ok:#35d07f;--nx-bad:#ff5c6c;--nx-warn:#f5c451}
body{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif !important;background:var(--nx-bg) !important;color:var(--nx-text) !important;-webkit-font-smoothing:antialiased}
.panel-lateral{width:300px;background:var(--nx-surface);border-right:1px solid var(--nx-line);padding:26px 20px}

.puntuacion-contenedor{gap:10px}

.caja-puntos strong{color:var(--nx-text);font-size:1.4rem;font-weight:800}

.btn:hover{background:#ff6070}

.grid-fondo{top:12px;left:12px;right:12px;bottom:12px;gap:12px}
.celda-vacia{background:#1d2230;border-radius:10px}
.capa-fichas{top:12px;left:12px;right:12px;bottom:12px}
.ficha{border-radius:10px;font-weight:800;width:calc((100% - 36px) / 4);height:calc((100% - 36px) / 4)}
.f-2{background:#e9edf5;color:#2b3142}.f-4{background:#d5ddf0;color:#2b3142}
.f-8{background:#ffb067;color:#fff}.f-16{background:#ff9548;color:#fff}.f-32{background:#ff7a45;color:#fff}.f-64{background:#ff5a47;color:#fff}
.f-128{background:#f5d061;color:#2b2406}.f-256{background:#f0c53f;color:#2b2406}.f-512{background:#e9b923;color:#2b2406}
.f-1024{background:#6dd3a0;color:#06210f}.f-2048{background:#3ec9ff;color:#04202b}.f-mas{background:#a37bff;color:#fff}
</style>
<style id="movil">
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.contenedor-juego,.tablero-2048{touch-action:none;-webkit-user-select:none;user-select:none}

  body{flex-direction:column;height:100vh}
  .panel-lateral{width:100%;flex:none;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-right:0;border-bottom:1px solid #232836}
  .panel-lateral h2,.seccion-historial{display:none}
  .panel-lateral > div:first-child{display:flex;align-items:center;gap:8px;flex:1;min-width:0}

  .caja-puntos{padding:4px 8px}.caja-puntos strong{font-size:1rem}
  .botones{display:flex;gap:6px;flex:none}.botones .btn{padding:8px 10px;font-size:.72rem;white-space:nowrap;margin:0}
  .contenedor-juego{padding:8px;gap:8px;min-height:0;flex:1}
  .tablero-2048{width:min(94vw,calc(100vh - 120px));height:min(94vw,calc(100vh - 120px));padding:8px}
  .grid-fondo{top:8px;left:8px;right:8px;bottom:8px;gap:8px}
  .capa-fichas{top:8px;left:8px;right:8px;bottom:8px}
  .ficha{font-size:clamp(1rem,6.5vw,1.8rem);width:calc((100% - 24px) / 4);height:calc((100% - 24px) / 4)}
}
@supports (height:100dvh){@media (max-width:800px), (pointer:coarse) and (max-width:1100px){body{height:100dvh}.tablero-2048{width:min(94vw,calc(100dvh - 120px));height:min(94vw,calc(100dvh - 120px))}}}
</style>

<body>

    <div class="panel-lateral">
        <div>
            <h2>Juego 2048</h2>
            <div class="info-estado" id="info-estado">Usa flechas o desliza</div>

            <div class="puntuacion-contenedor">
                <div class="caja-puntos">
                    <span>Puntuación</span>
                    <strong id="puntuacion">0</strong>
                </div>
                <div class="caja-puntos">
                    <span>Récord</span>
                    <strong id="record">0</strong>
                </div>
            </div>

            <div class="seccion-historial">
                <h3>Últimas Partidas</h3>
                <ul class="lista-partidas" id="lista-historial"></ul>
            </div>
        </div>

        <div class="botones">
            <button class="btn" onclick="reiniciarJuego()">Reiniciar</button>
            <a href="../index.html" class="btn btn-volver">Menú</a>
        </div>
    </div>

    <div class="contenedor-juego">
        <div class="tablero-2048" id="tablero">
            <div class="grid-fondo">
                <div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div>
                <div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div>
                <div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div>
                <div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div><div class="celda-vacia"></div>
            </div>
            <div class="capa-fichas" id="capa-fichas"></div>
        </div>
    </div>

    <script>
        let tablero = [];
        let puntuacion = 0;
        let record = localStorage.getItem('2048_record') || 0;
        let juegoTerminado = false;
        let contadorId = 1;

        document.getElementById('record').textContent = record;

        function iniciarJuego() {
            tablero = Array(4).fill(null).map(() => Array(4).fill(null));
            puntuacion = 0;
            juegoTerminado = false;
            document.getElementById('puntuacion').textContent = puntuacion;
            document.getElementById('info-estado').textContent = "¡A por el 2048!";
            
            agregarAleatorio();
            agregarAleatorio();
            actualizarTableroUI();
        }

        function reiniciarJuego() {
            if (puntuacion > 0) registrarPartida(puntuacion);
            iniciarJuego();
        }

        function agregarAleatorio() {
            let vacias = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (!tablero[r][c]) vacias.push({r, c});
                }
            }
            if (vacias.length > 0) {
                let pos = vacias[Math.floor(Math.random() * vacias.length)];
                tablero[pos.r][pos.c] = {
                    id: contadorId++,
                    valor: Math.random() < 0.9 ? 2 : 4,
                    fusionado: false
                };
            }
        }

        function actualizarTableroUI() {
            const capa = document.getElementById('capa-fichas');
            capa.innerHTML = '';

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    let tile = tablero[r][c];
                    if (tile) {
                        let div = document.createElement('div');
                        let claseValor = tile.valor <= 2048 ? tile.valor : 'mas';
                        div.className = `ficha f-${claseValor}`;
                        if (tile.fusionado) div.classList.add('fusionada');
                        div.textContent = tile.valor;

                        // Posicionamiento absoluto fluido con transform
                        div.style.transform = `translate(calc(${c} * (100% + 15px)), calc(${r} * (100% + 15px)))`;
                        capa.appendChild(div);

                        tile.fusionado = false; // Resetear flag
                    }
                }
            }

            document.getElementById('puntuacion').textContent = puntuacion;
            if (puntuacion > record) {
                record = puntuacion;
                localStorage.setItem('2048_record', record);
                document.getElementById('record').textContent = record;
            }
        }

        function procesarLinea(linea) {
            let filtrada = linea.filter(t => t !== null);
            let nuevaLinea = [];
            let huboCambio = false;
            let i = 0;

            while (i < filtrada.length) {
                if (i + 1 < filtrada.length && filtrada[i].valor === filtrada[i + 1].valor) {
                    let valDoble = filtrada[i].valor * 2;
                    puntuacion += valDoble;
                    nuevaLinea.push({
                        id: filtrada[i].id,
                        valor: valDoble,
                        fusionado: true
                    });
                    i += 2;
                    huboCambio = true;
                } else {
                    nuevaLinea.push(filtrada[i]);
                    i++;
                }
            }

            while (nuevaLinea.length < 4) nuevaLinea.push(null);

            for (let j = 0; j < 4; j++) {
                let idAnt = linea[j] ? linea[j].id : null;
                let idNue = nuevaLinea[j] ? nuevaLinea[j].id : null;
                let valAnt = linea[j] ? linea[j].valor : 0;
                let valNue = nuevaLinea[j] ? nuevaLinea[j].valor : 0;
                if (idAnt !== idNue || valAnt !== valNue) huboCambio = true;
            }

            return { linea: nuevaLinea, cambio: huboCambio };
        }

        function mover(dir) {
            if (juegoTerminado) return;
            let movido = false;

            if (dir === 'L') {
                for (let r = 0; r < 4; r++) {
                    let res = procesarLinea(tablero[r]);
                    tablero[r] = res.linea;
                    if (res.cambio) movido = true;
                }
            } else if (dir === 'R') {
                for (let r = 0; r < 4; r++) {
                    let rev = [...tablero[r]].reverse();
                    let res = procesarLinea(rev);
                    tablero[r] = res.linea.reverse();
                    if (res.cambio) movido = true;
                }
            } else if (dir === 'U') {
                for (let c = 0; c < 4; c++) {
                    let col = [tablero[0][c], tablero[1][c], tablero[2][c], tablero[3][c]];
                    let res = procesarLinea(col);
                    for (let r = 0; r < 4; r++) tablero[r][c] = res.linea[r];
                    if (res.cambio) movido = true;
                }
            } else if (dir === 'D') {
                for (let c = 0; c < 4; c++) {
                    let col = [tablero[0][c], tablero[1][c], tablero[2][c], tablero[3][c]].reverse();
                    let res = procesarLinea(col);
                    let colRes = res.linea.reverse();
                    for (let r = 0; r < 4; r++) tablero[r][c] = colRes[r];
                    if (res.cambio) movido = true;
                }
            }

            if (movido) {
                agregarAleatorio();
                actualizarTableroUI();

                if (verificarFin()) {
                    juegoTerminado = true;
                    document.getElementById('info-estado').textContent = "¡Partida Finalizada!";
                    registrarPartida(puntuacion);
                }
            }
        }

        function verificarFin() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (!tablero[r][c]) return false;
                    if (c < 3 && tablero[r][c].valor === tablero[r][c+1].valor) return false;
                    if (r < 3 && tablero[r][c].valor === tablero[r+1][c].valor) return false;
                }
            }
            return true;
        }

        document.addEventListener('keydown', (e) => {
            const map = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' };
            if (map[e.key]) { e.preventDefault(); mover(map[e.key]); }
        });

        let touchX = null, touchY = null;
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            if (!touchX || !touchY) return;
            let dx = e.changedTouches[0].clientX - touchX;
            let dy = e.changedTouches[0].clientY - touchY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
                mover(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
            }
            touchX = null; touchY = null;
        }, {passive: true});

        function registrarPartida(pts) {
            let hist = JSON.parse(localStorage.getItem('2048_hist')) || [];
            hist.unshift({ pts, hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            if (hist.length > 10) hist.pop();
            localStorage.setItem('2048_hist', JSON.stringify(hist));
            renderHistorial();
        }

        function renderHistorial() {
            let hist = JSON.parse(localStorage.getItem('2048_hist')) || [];
            let lista = document.getElementById('lista-historial');
            lista.innerHTML = hist.length ? '' : `<li style="text-align:center; color:#777;">Sin registros</li>`;
            hist.forEach(h => {
                let li = document.createElement('li');
                li.innerHTML = `<span>${h.hora}</span><span class="tag-puntos">${h.pts} pts</span>`;
                lista.appendChild(li);
            });
        }

        iniciarJuego();
        renderHistorial();
    </script>
</body>
</html>
