<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suika Game Minimal - NexGame</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --primary: #ff4757;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        #marcador {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #canvas-container {
            position: relative;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 2px solid #2f3640;
        }
    </style>
    <!-- Importamos Matter.js para las físicas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <h1>Suika Game</h1>
    <div id="marcador">Puntuación: <span id="score">0</span></div>
    <div id="canvas-container"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;

        // Configuración del canvas
        const anchoCanvas = 400;
        const altoCanvas = 600;

        // 1. Crear motor y mundo físico
        const engine = Engine.create();
        const world = engine.world;

        // 2. Crear renderizador
        const render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: {
                width: anchoCanvas,
                height: altoCanvas,
                wireframes: false,
                background: '#1e1e1e'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // 3. Crear paredes del frasco y suelo (estáticos)
        const ground = Bodies.rectangle(anchoCanvas / 2, altoCanvas - 10, anchoCanvas, 20, { isStatic: true, render: { fillStyle: '#2f3640' } });
        const wallLeft = Bodies.rectangle(10, altoCanvas / 2, 20, altoCanvas, { isStatic: true, render: { fillStyle: '#2f3640' } });
        const wallRight = Bodies.rectangle(anchoCanvas - 10, altoCanvas / 2, 20, altoCanvas, { isStatic: true, render: { fillStyle: '#2f3640' } });
        
        Composite.add(world, [ground, wallLeft, wallRight]);

        // 4. Definición de las frutas (niveles, radios, colores y puntos)
        const frutasConfig = [
            { radius: 15, color: '#ff4757', score: 2 },   // Nivel 0: Fresa
            { radius: 22, color: '#ffa502', score: 4 },   // Nivel 1: Uva
            { radius: 30, color: '#ff7f50', score: 8 },   // Nivel 2: Mandarina
            { radius: 40, color: '#eccc68', score: 16 },  // Nivel 3: Persimón
            { radius: 52, color: '#7bed9f', score: 32 },  // Nivel 4: Manzana
            { radius: 65, color: '#2ed573', score: Puntuacion = 64 } // Nivel 5: Pera / Sandía pequeña
        ];

        let puntuacion = 0;
        let frutaActualNivel = 0;
        let posXControl = anchoCanvas / 2;
        let puedeSoltar = true;

        // Actualizar posición de la fruta al mover el ratón por la parte superior
        document.addEventListener('mousemove', (event) => {
            const rect = render.canvas.getBoundingClientRect();
            let x = event.clientX - rect.left;
            // Limitar dentro de los bordes del frasco
            if (x > 35 && x < anchoCanvas - 35) {
                posXControl = x;
            }
        });

        // Soltar fruta al hacer clic
        window.addEventListener('click', (event) => {
            // Validar que se haga clic dentro del área del juego
            const rect = render.canvas.getBoundingClientRect();
            if (event.clientX >= rect.left && event.clientX <= rect.right &&
                event.clientY >= rect.top && event.clientY <= rect.bottom) {
                
                if (!puedeSoltar) return;
                puedeSoltar = false;

                soltarFruta(posXControl, 60, frutaActualNivel);

                // Elegir aleatoriamente el siguiente tipo (solo niveles bajos 0, 1 o 2)
                frutaActualNivel = Math.floor(Math.random() * 3);

                // Pequeño retraso para evitar spam de clics
                setTimeout(() => {
                    puedeSoltar = true;
                }, 400);
            }
        });

        function soltarFruta(x, y, nivel) {
            const config = frutasConfig[nivel];
            const fruta = Bodies.circle(x, y, config.radius, {
                restitution: 0.2, // Rebote ligero
                friction: 0.05,
                render: { fillStyle: config.color },
                label: `fruta-${nivel}`
            });

            Composite.add(world, fruta);
        }

        // 5. Detección de colisiones para las fusiones
        Events.on(engine, 'collisionStart', (event) => {
            const pairs = event.pairs;

            pairs.forEach((pair) => {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;

                // Verificar si ambas etiquetas corresponden a frutas
                if (bodyA.label && bodyA.label.startsWith('fruta-') &&
                    bodyB.label && bodyB.label.startsWith('fruta-')) {

                    const nivelA = parseInt(bodyA.label.split('-')[1]);
                    const nivelB = parseInt(bodyB.label.split('-')[1]);

                    // Si son del mismo nivel y aún no han alcanzado el nivel máximo
                    if (nivelA === nivelB && nivelA < frutasConfig.length - 1) {
                        // Evitar procesamiento duplicado del mismo par
                        if (bodyA.isRemoved || bodyB.isRemoved) return;
                        bodyA.isRemoved = true;
                        bodyB.isRemoved = true;

                        // Calcular punto medio del choque para crear la nueva fruta fusionada
                        const posX = (bodyA.position.x + bodyB.position.x) / 2;
                        const posY = (bodyA.position.y + bodyB.position.y) / 2;

                        // Eliminar las dos frutas anteriores del mundo
                        Composite.remove(world, [bodyA, bodyB]);

                        // Crear la nueva fruta del siguiente nivel
                        const nuevoNivel = nivelA + 1;
                        soltarFruta(posX, posY, nuevoNivel);

                        // Sumar puntos
                        puntuacion += frutasConfig[nuevoNivel].score;
                        document.getElementById('score').innerText = puntuacion;
                    }
                }
            });
        });
    </script>
</body>
</html>
