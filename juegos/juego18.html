<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Valle Verde - NexGame</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b2a14;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.box{background:linear-gradient(#f3dfb0,#e2c58a);border:3px solid #8b5a2b;border-radius:10px;box-shadow:0 4px 0 #5c3a1a,0 8px 18px #0006;color:#4a2e12}
#top{position:fixed;top:8px;left:8px;padding:6px 12px;font-size:15px;line-height:1.5;z-index:5}
#top b{font-size:17px}
#bag{position:fixed;top:8px;right:8px;padding:6px 10px;font-size:15px;z-index:5;max-width:44vw}
#menuBtn{position:fixed;top:8px;right:8px;display:none}
#hot{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:5}
.slot{width:48px;height:52px;background:#f8ecc8;border:2px solid #b98b52;border-radius:7px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:#e53935;background:#fff6d6;transform:translateY(-4px);box-shadow:0 0 0 2px #fff8}
.slot canvas{position:static;width:34px;height:34px;image-rendering:pixelated}
#bag img{height:20px;vertical-align:-5px;image-rendering:pixelated}
#dlg button img.ic{height:20px;vertical-align:-5px;image-rendering:pixelated}
.slot i{position:absolute;top:1px;left:3px;font-size:10px;font-style:normal;color:#7a5a30}
.slot b{position:absolute;bottom:0;right:3px;font-size:12px;color:#222}
#en{position:fixed;right:10px;bottom:10px;width:26px;height:120px;background:#2a2a2a;border:3px solid #8b5a2b;border-radius:6px;z-index:5;overflow:hidden}
#en i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#9be564,#3fa34d)}
#en span{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:13px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:15px;opacity:0;transition:opacity .4s;z-index:9;pointer-events:none;text-align:center}
#dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 18px;z-index:20;display:none;min-width:min(88vw,330px);max-height:90vh;overflow:auto}
#dlg p{margin:0 0 10px;font-size:16px}
#dlg button{display:block;width:100%;margin:5px 0;padding:9px;font-size:15px;font-family:inherit;color:#fff;background:linear-gradient(#5cb85c,#3d8f3d);border:2px solid #2a6a2a;border-radius:8px;cursor:pointer}
#dlg button.gris{background:linear-gradient(#b9a37a,#8f7a54);border-color:#5c4a2a}
#dlg button:disabled{opacity:.45}
#joy{position:fixed;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;background:#fff3;border:2px solid #fff7;z-index:6;display:none}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#fffb;pointer-events:none}
#act{position:fixed;right:52px;bottom:70px;width:84px;height:84px;border-radius:50%;background:#e5393599;border:3px solid #fff9;color:#fff;font-size:17px;font-weight:bold;z-index:6;display:none;align-items:center;justify-content:center}
.touch #joy{display:block}.touch #act{display:flex}.touch #menuBtn{display:block;top:72px;left:8px;right:auto}.touch #bag{top:8px}
.touch #hot{bottom:auto;top:8px;left:auto;right:8px;transform:none;flex-wrap:wrap;width:250px;justify-content:center}.touch #bag{top:auto;bottom:8px;right:auto;left:50%;transform:translateX(-50%);max-width:70vw}
.touch .slot{width:44px;height:46px}
#menuBtn{padding:5px 10px;cursor:pointer;z-index:5;font-size:14px}

#bag{cursor:pointer;max-width:none}
#hpb{position:fixed;right:42px;bottom:10px;width:20px;height:120px;background:#2a2a2a;border:3px solid #8b5a2b;border-radius:6px;z-index:5;overflow:hidden}
#hpb i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ff8a80,#e53935)}
#hpb span{position:absolute;top:0;left:0;right:0;text-align:center;font-size:11px}
#hot{width:max-content;max-width:96vw;flex-wrap:wrap;justify-content:center}
#dlg .tabs{display:flex;gap:4px}#dlg .tabs button{margin:0 0 8px;padding:7px 2px;font-size:13px}
#dlg button img.ic{height:24px;vertical-align:-7px;margin-right:4px}
#dlg button small{opacity:.9}
#inv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 16px;z-index:22;display:none;width:min(94vw,400px);max-height:94vh;overflow:auto}
#inv p{margin:0 0 8px;font-size:16px}
.xb{cursor:pointer;padding:0 6px}
#ig{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.is{aspect-ratio:1;background:#f8ecc8;border:2px solid #b98b52;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.is.hb{border-color:#8fae5a}.is.on{border-color:#e53935;background:#fff6d6;box-shadow:0 0 0 2px #fff8}
.is img{width:70%;image-rendering:pixelated}.is b{position:absolute;right:4px;bottom:1px;font-size:13px;color:#222}
#info{min-height:78px;margin-top:8px}
#info .row2{display:flex;gap:4px;flex-wrap:wrap}#info .row2 button{width:auto;flex:1;margin:0;padding:7px 4px;font-size:13px;display:block;color:#fff;background:linear-gradient(#5cb85c,#3d8f3d);border:2px solid #2a6a2a;border-radius:8px;cursor:pointer;font-family:inherit}
#info .row2 button.gris{background:linear-gradient(#b9a37a,#8f7a54);border-color:#5c4a2a}
#eq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#eq span{display:flex;flex-direction:column;align-items:center}#eq img{width:30px;image-rendering:pixelated}#eq small{font-size:10px}
#pick{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:center;justify-content:center}
#pickbox{padding:16px;text-align:center;width:min(96vw,520px);background:linear-gradient(#f3dfb0,#e2c58a);border:3px solid #8b5a2b;border-radius:10px;color:#4a2e12}
#pickbox p{margin:0 0 10px;font-size:18px}
#cards{display:flex;gap:8px;justify-content:center}
.card{flex:1;background:#f8ecc8;border:3px solid #b98b52;border-radius:10px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.card.on{border-color:#e53935}.card:hover{background:#fff6d6}
.card canvas{position:static;width:100%;max-width:120px;height:auto;aspect-ratio:120/130}
.card b{font-size:16px}.card small{font-size:11px}
#pickbox button{display:block;width:100%;padding:9px;font-size:15px;font-family:inherit;color:#fff;background:linear-gradient(#b9a37a,#8f7a54);border:2px solid #5c4a2a;border-radius:8px;cursor:pointer}
.touch #hot{width:300px;max-width:60vw;gap:3px;padding:4px}.touch .slot{width:38px;height:42px}.touch .slot canvas{width:30px;height:30px}
.touch #hpb{right:40px;bottom:10px}
@media (max-height:480px){#ig{grid-template-columns:repeat(10,1fr)}#inv{width:min(96vw,640px);padding:8px 12px}#inv p{margin-bottom:4px}#info{min-height:56px}}
#chBtn{position:fixed;left:8px;top:78px;padding:5px 10px;cursor:pointer;z-index:5;font-size:14px}
.touch #chBtn{left:96px;top:72px}
#craftBtn{position:fixed;left:8px;top:116px;padding:5px 10px;cursor:pointer;z-index:5;font-size:14px}
.touch #craftBtn{left:150px;top:72px}.touch #chBtn span,.touch #craftBtn span,.touch #chBtn small,.touch #craftBtn small{display:none}
#chest{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 14px;z-index:22;display:none;width:min(96vw,460px);max-height:94vh;overflow:auto}
#chest p{margin:0 0 6px;font-size:15px}.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
@media (max-height:480px){.cg{grid-template-columns:repeat(10,1fr)}#chest{width:min(96vw,640px);padding:8px 12px}}
#chest .mv{display:block;width:100%;margin-top:8px;padding:7px;font-family:inherit;font-size:13px;color:#fff;background:linear-gradient(#b9a37a,#8f7a54);border:2px solid #5c4a2a;border-radius:8px;cursor:pointer}
#mapBtn{position:fixed;left:8px;top:154px;padding:5px 10px;cursor:pointer;z-index:5;font-size:14px}
.touch #mapBtn{left:204px;top:72px}.touch #mapBtn span,.touch #mapBtn small{display:none}
#runBtn{display:none;position:fixed;right:20px;bottom:196px;width:54px;height:54px;border-radius:50%;align-items:center;justify-content:center;font-size:26px;z-index:6;cursor:pointer;user-select:none}
.touch #runBtn{display:flex}#runBtn.on{background:#9ad66a;border-color:#3c7a1f}
#map{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px;z-index:22;display:none;max-width:97vw}
#mapc{position:static!important;display:block;width:min(92vw,720px);height:auto;max-height:78vh;object-fit:contain;image-rendering:pixelated;border:2px solid #8b5a2b;border-radius:6px}
#dlg{max-height:92vh;overflow:auto}
#dlg .srow,#dlg .prow{display:flex;align-items:center;gap:8px;padding:3px 0}
#dlg .srow img,#dlg .prow img{width:28px;height:28px;image-rendering:pixelated}
#dlg .srow span,#dlg .prow span{flex:1;font-size:14px}
#dlg .prow b{font-size:14px}
#dlg .srow button{width:auto;display:block;margin:0;padding:5px 10px;font-size:13px;line-height:1.1}
</style></head><body>
<canvas id="c"></canvas>
<div id="top" class="box"></div>
<div id="bag" class="box"></div>
<div id="hot" class="box"></div>
<div id="en"><span>⚡</span><i id="enf"></i></div>
<div id="hpb"><span>❤</span><i id="hpf"></i></div>
<div id="toast" class="box"></div>
<div id="dlg" class="box"></div>
<div id="inv" class="box"></div>
<div id="chest" class="box"></div>
<div id="map" class="box"><p style="display:flex;justify-content:space-between;margin:0 0 6px"><b>🗺 Mapa del valle</b><span class="xb" onclick="closeMap()">✖</span></p><canvas id="mapc"></canvas><p style="font-size:12px;margin:6px 0 0">⬜ tú · 🟥 casa · 🟧 tienda y cofres · 🟨 venta · 🟢 cultivos</p></div>
<div id="runBtn" class="box">🏃</div>
<div id="pick"><div id="pickbox"></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="act">USAR</div>
<div id="chBtn" class="box" onclick="openPick()">👤<span> Personaje</span> <small>(C)</small></div>
<div id="mapBtn" class="box" onclick="openMap()">🗺<span> Mapa</span> <small>(M)</small></div>
<div id="craftBtn" class="box" onclick="abrirCrafteo()">🔨<span> Crafteo</span> <small>(F)</small></div>
<div id="menuBtn" class="box" onclick="menu()">☰ Menú</div>
