<script>
(() => {
'use strict';
const VIEW_H = 11, CEIL = 10, SPD = 10.4, GRAV = 67, JV = 16.8, DT = 1 / 120;
const SPEEDS = [0.8, 1, 1.25, 1.6];
function rngS(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- construcción de niveles ---------- */
function newLevel() { return { cells: new Map(), haz: new Map(), items: [], itemCol: new Map(), ceilOn: [], end: 0, coinSpots: [], nid: 0 }; }
const addTo = (m, x, v) => { let a = m.get(x); if (!a) { a = []; m.set(x, a); } a.push(v); };
const B = (L, x, y) => addTo(L.cells, x, y);
const SPK = (L, x, y, down) => addTo(L.haz, x, { t: down ? 'spkd' : 'spk', x, y });
function SAW(L, x, y, r) { const o = { t: 'saw', x, y, r }; for (let c = Math.floor(x - r); c <= Math.floor(x + r); c++) addTo(L.haz, c, o); }
function IT(L, o) { o.id = L.nid++; L.items.push(o); addTo(L.itemCol, Math.floor(o.x), o); return o; }
const CEILRANGE = (L, a, b) => { for (let x = Math.floor(a); x <= Math.ceil(b); x++) L.ceilOn[x] = true; };
/* portal con pared: bloques desde el suelo hasta el hueco y desde el hueco hasta el techo (2 columnas de grosor),
   así el único camino es atravesar el portal. Hueco = celdas [y0, y1) */
function GATE(L, k, x, y0, y1) {
  for (let c = x - 1; c <= x; c++) {
    for (let y = 0; y < y0; y++) B(L, c, y);
    for (let y = y1; y < CEIL; y++) B(L, c, y);
  }
  return IT(L, { t: 'port', k, x, y: (y0 + y1) / 2, h: y1 - y0 });
}

/* patrones de cubo (suelo): cada uno devuelve el ancho que ocupa */
const PAT = {
  s1(L, x, r, d) { SPK(L, x, 0, false); L.coinSpots.push([x, 2.4]); return 1; },
  s2(L, x, r, d) { SPK(L, x, 0, false); SPK(L, x + 1, 0, false); L.coinSpots.push([x + .5, 2.5]); return 2; },
  s3(L, x, r, d) { for (let i = 0; i < 3; i++) SPK(L, x + i, 0, false); L.coinSpots.push([x + 1, 2.9]); return 3; },
  s4(L, x, r, d) { for (let i = 0; i < 4; i++) SPK(L, x + i, 0, false); return 4; },
  /* dos o tres pinchos sueltos al ritmo (saltos encadenados) */
  tap(L, x, r, d) { const gap = d >= 4 ? 5 : 6, n = d >= 3 ? 3 : 2; for (let i = 0; i < n; i++) SPK(L, x + i * gap, 0, false); L.coinSpots.push([x + gap / 2, 3.2]); return (n - 1) * gap + 1; },
  /* doble + simple: salto largo y salto corto */
  pair(L, x, r, d) { SPK(L, x, 0, false); SPK(L, x + 1, 0, false); SPK(L, x + 6, 0, false); return 7; },
  /* escalera de bloques que sube y baja */
  step(L, x, r, d) {
    const hs = d >= 3 ? [1, 2, 2, 1] : [1, 2, 1]; let i = 0;
    hs.forEach(h => { for (let k = 0; k < 2; k++) { for (let y = 0; y < h; y++) B(L, x + i, y); i++; } });
    L.coinSpots.push([x + 3, 3.4]); return i;
  },
  /* plataforma baja con un pincho encima */
  tower(L, x, r, d) {
    const len = 7; for (let i = 0; i < len; i++) B(L, x + i, 0);
    SPK(L, x + 3 + (r() < .5 ? 0 : 1), 1, false); if (d >= 3.5) SPK(L, x + len, 0, false);
    L.coinSpots.push([x + 3, 3.2]); return len + (d >= 3.5 ? 1 : 0);
  },
  /* dos plataformas separadas por un foso de pinchos */
  bridge(L, x, r, d) {
    const a = 3, gap = 3, b = 4;
    for (let i = 0; i < a; i++) B(L, x + i, 0);
    for (let i = 0; i < gap; i++) SPK(L, x + a + i, 0, false);
    for (let i = 0; i < b; i++) B(L, x + a + gap + i, 0);
    L.coinSpots.push([x + a + gap / 2, 3.2]); return a + gap + b;
  },
  /* foso largo con un orbe amarillo */
  orbs(L, x, r, d) {
    const n = 6; for (let i = 0; i < n; i++) SPK(L, x + 1 + i, 0, false);
    IT(L, { t: 'orb', c: 'y', x: x + 1 + n / 2 - 0.5, y: 2.4 }); L.coinSpots.push([x + n / 2 + 1, 4]); return n + 2;
  },
  /* foso muy largo con dos orbes */
  orbs2(L, x, r, d) {
    const n = 10; for (let i = 0; i < n; i++) SPK(L, x + 1 + i, 0, false);
    IT(L, { t: 'orb', c: 'y', x: x + 3.5, y: 2.4 }); IT(L, { t: 'orb', c: 'y', x: x + 8, y: 2.4 });
    L.coinSpots.push([x + 6, 4.2]); return n + 2;
  },
  /* plataforma elevadora: pad amarillo y pinchos */
  pad(L, x, r, d) {
    IT(L, { t: 'pad', c: 'y', x, y: 0 }); const n = 3 + (d >= 3 ? 1 : 0);
    for (let i = 0; i < n; i++) SPK(L, x + 4 + i, 0, false);
    L.coinSpots.push([x + 5, 3.6]); return n + 4;
  },
  /* sierra giratoria entre dos pinchos */
  saw(L, x, r, d) { SAW(L, x + 1, 1.35, 0.85); L.coinSpots.push([x + 1, 3.6]); return 3; },
  /* sierra + pinchos */
  sawspk(L, x, r, d) { SPK(L, x, 0, false); SAW(L, x + 7, 1.35, 0.85); return 9; },
  /* saltos de bloque en bloque sobre pinchos */
  hop(L, x, r, d) {
    for (let k = 0; k < 3; k++) { B(L, x + k * 6, 0); B(L, x + k * 6 + 1, 0); if (k < 2) for (let i = 2; i < 5; i++) SPK(L, x + k * 6 + i, 0, false); }
    return 14;
  }
};
const PTABLE = [
  /* nombre, dificultad mínima, peso */
  ['s1', 0, 5], ['s2', 0, 4], ['step', 0, 2], ['pad', 0, 2], ['tower', 1.4, 3], ['s3', 1.8, 3], ['tap', 1.8, 3], ['orbs', 1.8, 3],
  ['bridge', 2.2, 3], ['pair', 2.4, 2], ['orbs2', 3, 2], ['hop', 3.4, 2], ['saw', 4, 2], ['sawspk', 4.4, 2], ['s4', 5, 2]
];
function cubeSection(L, x0, len, d, r) {
  const beat = SPD * 60 / (L.bpm || 120), end = x0 + len; let x = x0 + 10, prev = null;
  while (x < end - 12) {
    const dl = d + ((x - x0) / len) * 0.9;
    let pick, seed, gap;
    if (prev && r() < 0.4) { pick = prev.pick; seed = prev.seed; gap = prev.gap; }
    else {
      const cand = PTABLE.filter(p => p[1] <= dl && !(prev && p[0] === prev.pick && p[0][0] !== 's'));
      let tot = 0; cand.forEach(p => tot += p[2]); let t = r() * tot; pick = cand[0][0];
      for (const p of cand) { t -= p[2]; if (t <= 0) { pick = p[0]; break; } }
      seed = Math.floor(r() * 1e9);
      const gb = dl < 2 ? [1.6, 2, 2.4] : dl < 4 ? [1.2, 1.6, 2] : [1, 1.25, 1.6];
      gap = Math.max(dl < 2 ? 7 : dl < 4 ? 6 : 5, Math.round(beat * gb[Math.floor(r() * gb.length)]));
    }
    const used = PAT[pick](L, x, rngS(seed), dl);
    prev = { pick, seed, gap }; x += used + gap;
  }
  return end;
}
/* pasillos: nave / ovni / onda */
function corridor(L, x0, len, cFn, gFn) {
  for (let i = 0; i < len; i++) {
    const x = x0 + i, c = cFn(i), g = gFn(i);
    const fl = Math.max(0, Math.round(c - g / 2)), cl = Math.min(CEIL, fl + Math.ceil(g));
    for (let y = 0; y < fl; y++) B(L, x, y);
    for (let y = cl; y < CEIL; y++) B(L, x, y);
    L.ceilOn[x] = true;
  }
}
function flightSection(L, x0, len, d, r, kind) {
  const base = kind === 'ufo' ? 6.4 : 6.2, g = Math.max(kind === 'ufo' ? 5 : 4.4, base - (d - 1) * 0.4), ms = kind === 'ufo' ? 0.32 : 0.5, ramp = 10;
  const pts = []; let c = 5, i = 0;
  const lo = g / 2 + 0.2, hi = CEIL - g / 2 - 0.2;
  pts.push([0, 5]);
  while (i < len - 2 * ramp) {
    const tgt = lo + r() * (hi - lo), seg = Math.max(7, Math.ceil(Math.abs(tgt - c) / ms)) + Math.floor(r() * 4);
    i += seg; pts.push([i, tgt]); c = tgt;
  }
  const cAt = k => { const kk = Math.max(0, k - ramp); let a = pts[0], b = pts[pts.length - 1]; for (let j = 0; j < pts.length - 1; j++) if (kk >= pts[j][0] && kk <= pts[j + 1][0]) { a = pts[j]; b = pts[j + 1]; break; } if (kk >= pts[pts.length - 1][0]) return pts[pts.length - 1][1]; return a[1] + (b[1] - a[1]) * (kk - a[0]) / Math.max(1, b[0] - a[0]); };
  const gAt = k => { const e = Math.min(k, len - k); return e >= ramp ? g : CEIL - (CEIL - g) * (e / ramp); };
  corridor(L, x0, len, k => k < ramp ? 4.5 : (len - k < ramp ? 5 + (cAt(len - ramp) - 5) * ((len - k) / ramp) : cAt(k)), gAt);
  for (let k = ramp + 6; k < len - ramp - 6; k += 7 + Math.floor(r() * 5)) {
    if (d >= 2.5 && r() < 0.6) { const cc = cAt(k), fl = Math.max(0, Math.round(cc - g / 2)); const sl = Math.abs(cAt(k + 2) - cAt(k - 2)); if (sl < 0.5) { SPK(L, x0 + k, fl, false); } }
  }
  for (let t = 0; t < 2; t++) { const k = Math.floor(len * (0.3 + t * 0.4)); L.coinSpots.push([x0 + k, cAt(k)]); }
  return x0 + len;
}
function waveSection(L, x0, len, d, r) {
  const gCells = Math.max(4, 7 - Math.floor(d * 0.6)), ramp = 10, path = [];
  let c = 5, dir = 1, k = ramp;
  for (let i = 0; i < ramp; i++) path[i] = 4.5;
  const lo = gCells / 2 + 0.5, hi = CEIL - gCells / 2 - 0.5;
  while (k < len - ramp) {
    if (c + dir > hi) dir = -1; else if (c + dir < lo) dir = 1; else if (r() < 0.35) dir = -dir; else if (d >= 2 && r() < 0.15) dir = 0;
    const seg = 2 + Math.floor(r() * (d >= 4 ? 3 : 5));
    for (let j = 0; j < seg && k < len - ramp; j++, k++) { c += dir; if (c > hi) { c = hi; dir = -1; } if (c < lo) { c = lo; dir = 1; } path[k] = c; }
  }
  for (let i = len - ramp; i < len; i++) path[i] = path[len - ramp - 1] || 5;
  corridor(L, x0, len, i => path[i], i => { const e = Math.min(i, len - i); return e >= ramp ? gCells : CEIL - (CEIL - gCells) * (e / ramp); });
  L.coinSpots.push([x0 + Math.floor(len * 0.5), path[Math.floor(len * 0.5)]]);
  return x0 + len;
}
function ballSection(L, x0, len, d, r) {
  CEILRANGE(L, x0, x0 + len);
  let x = x0 + 12, floor = true; const sp = 9 - Math.min(3, d - 1);
  while (x < x0 + len - 12) {
    const n = 1 + Math.floor(r() * (d >= 3 ? 2 : 1));
    for (let i = 0; i < n; i++) SPK(L, x + i, floor ? 0 : CEIL - 1, !floor);
    if (r() < 0.25) L.coinSpots.push([x, CEIL / 2]);
    x += n + sp + Math.floor(r() * 2); floor = !floor;
  }
  return x0 + len;
}
function gravSection(L, x0, len, d, r) {
  CEILRANGE(L, x0, x0 + len);
  let x = x0 + 10, up = false; GATE(L, 'gdn', x0 + 2, 0, 3);
  while (x < x0 + len - 20) {
    if (up) GATE(L, 'gdn', x, CEIL - 3, CEIL); else GATE(L, 'gup', x, 0, 3);
    const sx = x + 9, n = 1 + Math.floor(r() * (d >= 3 ? 3 : 2));

function solveLevel(L, W, sub) {

  const rnd = rngS(12345);

    for (const P of beam) {

        for (let s = 0; s < sub && !Q.dead && !Q.done; s++) stepP(L, Q, DT, hold, null);
        if (Q.dead) continue;
        if (Q.done) return true;
        const key = Math.round(Q.y * 12) + '|' + Math.round(Q.vy * 3) + '|' + Q.mode + Q.grav + Q.spd + (Q.og ? 1 : 0) + Math.round(Q.rot / 90 % 4) + (hold ? 1 : 0) + '|' + Q.used.length;
        if (!next.has(key)) next.set(key, Q);

  const orbs = Math.round((sem ? 500 : 60) + R() * (sem ? 1000 : 240)), diam = Math.round((sem ? 5 : 1) + R() * (sem ? 10 : 3));
  giveOrbs(orbs); giveDiam(diam); let extra = '';
  if (R() < (sem ? 0.6 : 0.2)) { const m = sem ? 'gold' : (R() < .5 ? 'gold' : 'silver'), n = sem ? 3 + Math.floor(R() * 6) : 1 + Math.floor(R() * 2); S[m] += n; extra += `<div class="rew tx">${iconSVGs[m]} +${n}</div>`; }
  if (R() < (sem ? 0.5 : 0.12)) { const lib = CATALOGO.filter(x => !S.own[x.key]); if (lib.length) { const it = lib[Math.floor(R() * lib.length)]; S.own[it.key] = 1; const nom = it.tipo === 'ic' ? 'Icono de ' + MODOS.find(m => m[0] === it.modo)[1] : it.tipo === 'co' ? 'Color' : it.tipo === 'tr' ? 'Estela' : it.tipo === 'de' ? 'Efecto de muerte' : 'Brillo'; extra += `<div class="rew tx">🎉 ¡Desbloqueado: ${nom}!</div>`; } }
  S[c.id] = Date.now() + c.ms; guardar(); sfx('win'); monedasPintar();
  openPanel(c.n, `<div style="padding:calc(var(--u)*3);text-align:center"><div class="rew tx">${iconSVGs.orbs} +${orbs}</div><div class="rew tx">${iconSVGs.diam} +${diam}</div>${extra}</div>`, { w: 'min(80vw,calc(var(--u)*80))' });
  chTick();
}
/* ================= Ajustes, estadísticas, perfil ================= */
function sliders() {
  return `<div class="sl"><span class="tx">Música</span><input type="range" min="0" max="100" value="${S.vm}" id="st-m"><span class="tx" style="margin-top:calc(var(--u)*1.4)">Efectos</span><input type="range" min="0" max="100" value="${S.vs}" id="st-s"></div>`;
}
function abrirAjustes() {
  const b = (id, t, c) => `<button class="gb ${c || ''}" id="${id}">${t}</button>`;
  openPanel('Ajustes', `<div class="setgrid">${b('a-acc', 'Cuenta')}${b('a-how', 'Cómo jugar')}${b('a-opt', 'Opciones')}${b('a-gfx', 'Gráficos')}${b('a-rate', 'Valorar', 'third')}${b('a-songs', 'Canciones', 'third')}${b('a-help', 'Ayuda', 'third')}</div>${sliders()}<div style="display:flex;justify-content:center;padding:calc(var(--u)*2)"><div class="chkrow tx" id="a-mm"><span>Música del menú</span><i class="${S.menuMus ? 'on' : ''}"></i></div></div>`, {
    w: 'min(92vw,calc(var(--u)*130))', after() {
      $('st-m').oninput = e => { S.vm = +e.target.value; volAplicar(); guardar(); }; $('st-s').oninput = e => { S.vs = +e.target.value; volAplicar(); guardar(); };
      $('a-mm').onclick = () => { S.menuMus = !S.menuMus; guardar(); sfx('click'); if (S.menuMus) menuMusic(); else if (Mus.cur === 'menu') Mus.stop(); $('a-mm').querySelector('i').classList.toggle('on', S.menuMus); };
      $('a-acc').onclick = abrirPerfil; $('a-how').onclick = abrirComoJugar; $('a-opt').onclick = abrirOpciones; $('a-gfx').onclick = abrirGraficos; $('a-songs').onclick = abrirCanciones;
      $('a-rate').onclick = () => modal('<b>¡Gracias por jugar a NexGame Dash!</b><br>Si te gusta, cuéntaselo a tus amigos.'); $('a-help').onclick = abrirAyuda;
    }
  });
}
function abrirComoJugar() { openPanel('Cómo jugar', `<div class="ptext"><b>Saltar:</b> toca la pantalla, haz clic o pulsa <b>espacio</b> / flecha arriba.<br><b>Nave, OVNI y onda:</b> mantén pulsado para subir, suelta para bajar.<br><b>Bola:</b> toca para cambiar la gravedad.<br><b>Orbes</b> (círculos): pulsa justo al tocarlos para saltar en el aire. <b>Plataformas de impulso:</b> te lanzan solas.<br><b>Portales:</b> cambian de modo, gravedad o velocidad.<br><b>Práctica:</b> pulsa la barra azul de un nivel; deja puntos de control automáticos.<br>Las monedas doradas son secretas; las plateadas, de usuario.</div>`); }
function abrirAyuda() { openPanel('Ayuda', `<div class="ptext"><b>¿Cómo consigo más orbes?</b> Cada intento te da orbes según el progreso. Completar un nivel por primera vez da orbes, diamantes y estrellas.<br><b>¿Cómo desbloqueo iconos?</b> En la tienda (botón del cartel en el kit de iconos) o en los cofres.<br><b>¿Puedo jugar con mi música?</b> Sí, en la última página de niveles: elige una canción y se crea el nivel.<br><b>¿Se guarda mi progreso?</b> Sí, en este navegador.</div>`); }
function abrirOpciones() { openPanel('Opciones', `<div style="padding:calc(var(--u)*3);text-align:center"><div class="ptext">Aquí puedes borrar todo tu progreso (iconos, monedas y estadísticas).</div><button class="gb r w" id="st-reset">Borrar progreso</button></div>`, { w: 'min(80vw,calc(var(--u)*90))', after() { $('st-reset').onclick = () => { if (confirm('¿Seguro? Se perderán iconos, monedas y progreso.')) { S = JSON.parse(JSON.stringify(DEF_SAVE)); guardar(); location.reload(); } }; } }); }
function abrirGraficos() {
  const ch = (id, t, v) => `<div class="chkrow tx" id="${id}" style="padding:calc(var(--u)*1.6) calc(var(--u)*4)"><i class="${v ? 'on' : ''}"></i><span>${t}</span></div>`;
  openPanel('Gráficos', ch('g-part', 'Partículas de muerte', S.fx.part) + ch('g-fps', 'Mostrar FPS', S.fx.fps) + ch('g-glow', 'Brillo del icono', S.glow), { w: 'min(80vw,calc(var(--u)*90))', after() {
    const tg = (id, fn) => $(id).onclick = () => { fn(); guardar(); sfx('click'); abrirGraficos(); };
    tg('g-part', () => S.fx.part = !S.fx.part); tg('g-fps', () => { S.fx.fps = !S.fx.fps; $('fps').style.display = S.fx.fps ? 'block' : 'none'; });
    tg('g-glow', () => { if (!owned('gl')) { showToast('🔒 ' + infoDe('gl')); return; } S.glow = !S.glow; });
  } });
}
function abrirCanciones() {
  const l = nivelesTodos().filter(d => d.song); let h = `<div class="ptext">`;
  h += l.length ? l.map(d => `• <b>${esc(d.n)}</b> — ${esc(d.a || '')}`).join('<br>') : 'Aún no tienes canciones propias.';
  h += `</div><div class="pbtns"><button class="gb" id="so-add">Añadir canción</button></div>`;
  openPanel('Canciones', h, { after() { $('so-add').onclick = () => lvFileInput().click(); } });
}
function nivelJ() { return Math.floor(S.stars / 10) + 1; }
function abrirPerfil() {
  const done = LEVELS.filter(l => lvS(l.id).done).length, dem = LEVELS.filter(l => l.d >= 6 && lvS(l.id).done).length;
  const st = (v, ic) => `<div class="tx">${v}${ic}</div>`;
  const h = `<div class="prof-body"><div class="prof-rank tx">Nivel<br><b style="font-size:calc(var(--u)*5);color:#fff">${nivelJ()}</b></div><div class="prof-name tx" id="pf-name">${esc(S.name)}</div>
    <div class="prof-stats">${st(S.stars, SV.star())}${st(S.gold, SV.gold)}${st(S.silver, SV.silver)}${st(S.stat.orbsTot, SV.orb)}${st(dem, '<span style="font-size:calc(var(--u)*5)">😈</span>')}</div>
    <div class="prof-ic" id="pf-ic"></div><div class="prof-bio" id="pf-bio"><span>${esc(S.bio)}</span><small>toca para editar</small></div><div class="pbtns"><button class="gb s r w" id="pf-out">Cerrar sesión</button></div></div>`;
  openPanel('Perfil', h, { w: 'min(90vw,calc(var(--u)*125))', after() {
    MODOS.forEach(m => $('pf-ic').appendChild(iconCanvas(m[0], S.icons[m[0]], COLORS[S.c1], COLORS[S.c2], 96)));
    $('pf-name').onclick = () => { const n = prompt('Tu nombre (máx. 14)', S.name); if (n && n.trim()) { S.name = n.trim().slice(0, 14).toUpperCase(); guardar(); monedasPintar(); abrirPerfil(); } };
    $('pf-out').onclick = cerrarSesion;
    $('pf-bio').onclick = () => { const n = prompt('Tu comentario (máx. 80)', S.bio); if (n != null) { S.bio = n.slice(0, 80); guardar(); abrirPerfil(); } };
  } });
}
function abrirStats() {
  const done = LEVELS.filter(l => lvS(l.id).done), cnt = f => done.filter(f).length;
  const sc = S.stat, r = (a, b) => `<div class="srow"><span>${a}</span><span>${b}</span></div>`;
  openPanel('Estadísticas', r('Saltos totales:', sc.jumps) + r('Intentos totales:', sc.att) + r('Estrellas:', S.stars) + r('Diamantes obtenidos:', sc.diamTot) + r('Orbes obtenidos:', sc.orbsTot) + r('Niveles completados:', done.length) + r('Niveles insanos:', cnt(l => l.d === 5)) + r('Niveles demon:', cnt(l => l.d >= 6)) + r('Retos diarios/semanales:', sc.dailyDone) + r('Monedas secretas:', S.gold) + r('Monedas de usuario:', S.silver) + r('Misiones cobradas:', 0 + (S.q ? S.q.claimed.reduce((a, b) => a + b, 0) : 0)), { w: 'min(88vw,calc(var(--u)*120))' });
}
function abrirLogros() {
  const done = LEVELS.filter(l => lvS(l.id).done).length, L = [['Primer paso', 'Completa un nivel', done >= 1], ['Aprendiz', 'Consigue 10 estrellas', S.stars >= 10], ['Veterano', 'Consigue 100 estrellas', S.stars >= 100], ['Saltarín', 'Salta 1000 veces', S.stat.jumps >= 1000], ['Incansable', 'Salta 10000 veces', S.stat.jumps >= 10000], ['Coleccionista', 'Consigue una moneda secreta', S.gold >= 1], ['Comprador', 'Compra un objeto', Object.keys(S.own).length >= 1], ['Demonio', 'Completa un nivel demon', LEVELS.some(l => l.d >= 6 && lvS(l.id).done)], ['Todoterreno', 'Completa los 12 niveles', done >= 12]];
  openPanel('Logros', L.map(([n, d, ok]) => `<div class="srow" style="height:calc(var(--u)*14)"><span style="font-size:calc(var(--u)*4.4)">${n}<br><small style="font-size:calc(var(--u)*3);color:#fff;text-shadow:none">${d}</small></span><span>${ok ? '✔' : '🔒'}</span></div>`).join(''), { w: 'min(88vw,calc(var(--u)*120))' });
}
/* ================= Enlaces ================= */
$('b-play').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-lv'); };
$('b-custom').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-cu'); };
$('b-online').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-on'); };
$('b-chest').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-ch'); };
$('b-set').onclick = () => { unlockAudio(); abrirAjustes(); };
$('b-stats').onclick = () => { unlockAudio(); abrirStats(); };
$('b-ach').onclick = () => { unlockAudio(); abrirLogros(); };
$('b-prof').onclick = () => { unlockAudio(); abrirPerfil(); };
/* pausa */
function syncPausa() { $('pa-m').value = S.vm; $('pa-s').value = S.vs; $('pa-prac').innerHTML = `<i class="${practica ? 'on' : ''}"></i><span class="tx">Modo práctica</span>`; }
$('pa-m').oninput = e => { S.vm = +e.target.value; volAplicar(); guardar(); }; $('pa-s').oninput = e => { S.vs = +e.target.value; volAplicar(); guardar(); };
$('pa-prac').onclick = () => { practica = !practica; $('h-prac').style.display = practica ? 'block' : 'none'; $('pausa').classList.remove('on'); cps = []; intentos = 1; reaparecer(true); };
function fpsTick(dt) { if (!S.fx.fps) return; fpsA = fpsA * 0.9 + (1 / Math.max(dt, 0.001)) * 0.1; if ((fpsN++ & 7) === 0) $('fps').textContent = Math.round(fpsA) + ' FPS'; }
let fpsA = 60, fpsN = 0;
/* ================= Cuenta obligatoria ================= */
const accHash = (n, p) => hashTxt(p + '|' + n.toUpperCase() + '|nexgame');
function accPantalla(modo) {
  const crear = modo === 'crear', a = $('acc'); a.classList.add('on');
  const f = (id, tipo, ph, v) => `<input id="${id}" type="${tipo}" placeholder="${ph}" maxlength="${tipo === 'text' ? 14 : 30}" autocomplete="off" value="${v || ''}">`;
  a.innerHTML = `<div class="pw" style="width:min(88vw,calc(var(--u)*100))"><div class="ptitle tx">${crear ? 'Crear cuenta' : 'Iniciar sesión'}</div><div class="pbody" style="max-height:none"><div class="accf">
    <div class="tx">${crear ? 'Elige tu nombre de usuario' : 'Cuenta: ' + esc(S.acc.name)}</div>
    ${crear ? f('ac-n', 'text', 'Usuario (3-14 letras o números)') : ''}${f('ac-p', 'password', 'Contraseña' + (crear ? ' (mín. 4)' : ''))}${crear ? f('ac-p2', 'password', 'Repite la contraseña') : ''}
    <div class="er" id="ac-e"></div><button class="gb" id="ac-ok">${crear ? 'Crear cuenta' : 'Entrar'}</button>
    ${crear ? '<div class="sm">La cuenta se guarda solo en este dispositivo.</div>' : '<button class="gb s o" id="ac-new">Crear cuenta nueva</button>'}</div></div><div class="pfoot"></div></div>`;
  const err = t => { $('ac-e').textContent = t; sfx('no'); };
  const go = () => {
    if (crear) {
      const n = $('ac-n').value.trim(), p = $('ac-p').value, p2 = $('ac-p2').value;
      if (!/^[A-Za-z0-9_]{3,14}$/.test(n)) return err('El usuario necesita 3-14 letras, números o _');
      if (p.length < 4) return err('La contraseña necesita al menos 4 caracteres');
      if (p !== p2) return err('Las contraseñas no coinciden');
      S.acc = { name: n.toUpperCase(), ph: accHash(n, p) }; S.name = S.acc.name;
    } else if (accHash(S.acc.name, $('ac-p').value) !== S.acc.ph) return err('Contraseña incorrecta');
    S.sess = true; guardar(); a.classList.remove('on'); a.innerHTML = ''; sfx('buy'); monedasPintar(); menuMusic();
  };
  $('ac-ok').onclick = () => { unlockAudio(); go(); };
  a.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') { unlockAudio(); go(); } });
  if (!crear) $('ac-new').onclick = () => { if (confirm('Se borrará el progreso de esta cuenta. ¿Continuar?')) { S = JSON.parse(JSON.stringify(DEF_SAVE)); guardar(); accPantalla('crear'); } };
  setTimeout(() => { const i = $(crear ? 'ac-n' : 'ac-p'); if (i) i.focus(); }, 50);
}
function cerrarSesion() { S.sess = false; guardar(); closePanel(); accPantalla('entrar'); }
function accInicio() { if (!S.acc) accPantalla('crear'); else if (!S.sess) accPantalla('entrar'); }
/* ================= Inicio ================= */
if (location.hash === '#debug') window.__dbg = { Mus, LEVELS, MENU_DEF };
fillIcons(); monedasPintar(); accInicio(); if (S.fx.fps) $('fps').style.display = 'block'; requestAnimationFrame(bucle);

})();
