<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Google Snake Pro Fluid - aldGAME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111b11;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .juego-wrapper {
            position: relative;
            background-color: #2b3924;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .barra-superior {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 15px 10px;
        }

        .score-info-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        .icono-fruta-mini {
            font-size: 1.6rem;
        }

        .btn-audio {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.8;
        }
        .btn-audio:hover { opacity: 1; }

        canvas {
            background-color: #38482d;
            border-radius: 14px;
            display: block;
        }

        .menu-inicio-overlay {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: #1e628d;
            border-radius: 20px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            z-index: 20;
            border: 2px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }

        .menu-inicio-overlay.oculto {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) scale(0.9);
        }

        .tarjeta-estadisticas {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.6rem;
        }

        .stat-item span.emoji-stat {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .serpiente-ilustracion {
            width: 100%;
            height: 80px;
            position: relative;
            margin-bottom: 25px;
        }

        .contenedor-botones-menu {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-jugar-google {
            flex: 1;
            background-color: #2b6c99;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-jugar-google:hover { background-color: #357cae; transform: translateY(-2px); }

        .btn-ajustes-google {
            background-color: #2b6c99;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-ajustes-google:hover { background-color: #357cae; transform: translateY(-2px); }

        .selector-mapa-footer {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .select-personalizado {
            background: #2b3924;
            color: #fff;
            border: 1px solid #4a5d3e;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-ajustes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .modal-ajustes.activo { opacity: 1; pointer-events: auto; }

        .modal-contenido-skin {
            background: #222d1d;
            border: 2px solid #3e5233;
            padding: 25px;
            border-radius: 20px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-contenido-skin h3 { color: #fff; font-size: 1.2rem; border-bottom: 1px solid #3e5233; padding-bottom: 8px; }

        .grid-opciones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-opcion-grid {
            background: #2b3924;
            border: 2px solid #4a5d3e;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .btn-opcion-grid.activo {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.25);
        }

        .btn-cerrar-modal {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-cerrar-modal:hover { background: #43A047; }

        .btn-volver-menu {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #2b3924;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #4a5d3e;
        }
        .btn-volver-menu:hover { background: #38482d; }
    </style>
<style id="movil">

  .btn-volver-menu{bottom:8px;left:8px;padding:6px 12px;font-size:.72rem}
}
</style>

                    <circle cx="221" cy="55" r="7" fill="#fff"/><circle cx="223.2" cy="55.5" r="3.8" fill="#111"/><circle cx="224.4" cy="54" r="1.3" fill="#fff"/>

            <div class="contenedor-botones-menu">

    <div class="selector-mapa-footer">
        <label style="font-size: 0.9rem; font-weight: bold; color: #a0b294;">Tamaño de Mapa:</label>

                <button class="btn-opcion-grid activo" onclick="seleccionarSkin('azul', this)">🔵 Azul Google</button>
                <button class="btn-opcion-grid" onclick="seleccionarSkin('clasica', this)">🟢 Clásica Verde</button>

    <script>
        const canvas = document.getElementById('tableroSnake');
        const ctx = canvas.getContext('2d');

        const mapasConfig = {
            compacto: { cols: 9, filas: 10, pixelSize: 44 },
            pequeno: { cols: 14, filas: 14, pixelSize: 34 },
            mediano: { cols: 20, filas: 20, pixelSize: 26 },
            grande: { cols: 26, filas: 26, pixelSize: 20 }
        };

        let modoMapa = 'mediano';
        let cols = mapasConfig[modoMapa].cols;
        let filas = mapasConfig[modoMapa].filas;
        let tileSize = mapasConfig[modoMapa].pixelSize;

        canvas.width = cols * tileSize;
        canvas.height = filas * tileSize;

        let snake = [];
        let snakeVisual = [];
        let comida = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let proximoDx = 1;
        let proximoDy = 0;
        let puntuacion = 0;
        
        let records = JSON.parse(localStorage.getItem('google_snake_records_v2')) || { compacto: 0, pequeno: 0, mediano: 0, grande: 0 };
        
        let juegoEnCurso = false;
        let audioActivo = true;
        let animacionFrameId = null;
        let ultimoTiempo = 0;
        const velocidadMovimiento = 110;

        let skinSeleccionada = 'azul';
        let frutaSeleccionada = 'manzana';
        let emojiFrutaActual = '🍎';

        const paletaSkins = {
            azul: { cabeza: '#3b82f6', cuerpo: '#60a5fa' },
            clasica: { cabeza: '#2e7d32', cuerpo: '#4caf50' },
            rojo: { cabeza: '#c62828', cuerpo: '#ef4444' },
            amarillo: { cabeza: '#f59e0b', cuerpo: '#fbbf24' },
            morado: { cabeza: '#7c3aed', cuerpo: '#a78bfa' },
            arcoiris: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6']
        };

        actualizarEstadisticasUI();

        let audioCtx = null;
        function reproducirSonido(tipo) {
            if (!audioActivo) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (tipo === 'comer') {
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (tipo === 'gameover') {
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch(e) {}
        }

        function actualizarEstadisticasUI() {
            document.getElementById('stat-score').textContent = puntuacion;
            document.getElementById('stat-record').textContent = records[modoMapa];
            document.getElementById('puntuacion-mini').textContent = puntuacion;
            document.getElementById('icono-fruta-ui').textContent = emojiFrutaActual;
            document.getElementById('stat-emoji-fruta').textContent = emojiFrutaActual;
        }

        function cambiarTamanoMapa() {
            if (juegoEnCurso) {
                juegoEnCurso = false;
                cancelAnimationFrame(animacionFrameId);
            }
            modoMapa = document.getElementById('select-tamano').value;
            cols = mapasConfig[modoMapa].cols;
            filas = mapasConfig[modoMapa].filas;
            tileSize = mapasConfig[modoMapa].pixelSize;

            canvas.width = cols * tileSize;
            canvas.height = filas * tileSize;

            actualizarEstadisticasUI();
            dibujarTableroVacio();
        }

        function abrirModalSkins(abrir) {
            const modal = document.getElementById('modal-skins');
            if (abrir) modal.classList.add('activo');
            else modal.classList.remove('activo');
        }

        function seleccionarSkin(skin, btn) {
            skinSeleccionada = skin;
            document.querySelectorAll('#grid-skins .btn-opcion-grid').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
        }

        function seleccionarFruta(fruta, emoji, btn) {
            frutaSeleccionada = fruta;
            emojiFrutaActual = emoji;
            document.querySelectorAll('#grid-frutas .btn-opcion-grid').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            actualizarEstadisticasUI();
        }

        function alternarAudio() {
            audioActivo = !audioActivo;
            document.getElementById('btn-audio').textContent = audioActivo ? '🔊' : '🔇';
        }

        function empezarJuego() {
            document.getElementById('menu-inicio').classList.add('oculto');
            
            let cx = Math.floor(cols / 2);
            let cy = Math.floor(filas / 2);
            snake = [
                { x: cx, y: cy },
                { x: cx - 1, y: cy },
                { x: cx - 2, y: cy }
            ];
            snakeVisual = snake.map(p => ({ x: p.x, y: p.y }));
            dx = 1; dy = 0;
            proximoDx = 1; proximoDy = 0;
            puntuacion = 0;
            actualizarEstadisticasUI();

            generarComida();
            juegoEnCurso = true;
            ultimoTiempo = performance.now();
            if (animacionFrameId) cancelAnimationFrame(animacionFrameId);
            animacionFrameId = requestAnimationFrame(buclePrincipal);
        }

        function buclePrincipal(tiempoActual) {
            if (!juegoEnCurso) return;

            let delta = tiempoActual - ultimoTiempo;
            const dtF = Math.min(50, tiempoActual - (window._pf || tiempoActual)); window._pf = tiempoActual;
            const k = 1 - Math.pow(0.01, dtF / 110);

            if (delta >= velocidadMovimiento) {
                ultimoTiempo = tiempoActual;
                actualizarLogicaSnake();
                if (!juegoEnCurso) return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (!snakeVisual[i]) {
                    snakeVisual[i] = { x: snake[i].x, y: snake[i].y };
                }
                let target = snake[i];
                let current = snakeVisual[i];
                current.x += (target.x - current.x) * k;
                current.y += (target.y - current.y) * k;
            }

            dibujarEscenario();
            animacionFrameId = requestAnimationFrame(buclePrincipal);
        }

        function actualizarLogicaSnake() {
            dx = proximoDx;
            dy = proximoDy;

            const cabeza = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(cabeza);
            // Sincronizamos también el array visual al añadir la cabeza
            snakeVisual.unshift({ x: snakeVisual[0].x, y: snakeVisual[0].y });

            if (cabeza.x === comida.x && cabeza.y === comida.y) {
                puntuacion += 10;
                reproducirSonido('comer'); crearParticulas(comida.x, comida.y);
                actualizarEstadisticasUI();
                generarComida();
            } else {
                snake.pop();
                // Si no comemos, retiramos el último segmento visual para mantener la longitud sincronizada
                snakeVisual.pop();
            }

            if (verificarGameOver()) {
                juegoEnCurso = false;
                reproducirSonido('gameover'); flashMuerte();

                if (puntuacion > records[modoMapa]) {
                    records[modoMapa] = puntuacion;
                    localStorage.setItem('google_snake_records_v2', JSON.stringify(records));
                }

                actualizarEstadisticasUI();
                document.getElementById('menu-inicio').classList.remove('oculto');
            }
        }

        let particulas = [];
        let angCabeza = 0;
        let tAnim = 0;

        function crearParticulas(gx, gy) {
            const cx = gx * tileSize + tileSize / 2, cy = gy * tileSize + tileSize / 2;
            const cols_ = ['#fff', '#ffd54a', '#ff8a65', '#aed581'];
            for (let i = 0; i < 16; i++) {
                const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 120;
                particulas.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 1, c: cols_[i % 4], r: 2 + Math.random() * 3 });
            }
        }

        function hexARgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
        function mezclar(c1, c2, t) {
            const a = hexARgb(c1), b = hexARgb(c2);
            return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
        }
        function colorSegmento(i, n) {
            if (skinSeleccionada === 'arcoiris') return `hsl(${(tAnim * 60 - i * 22) % 360},80%,58%)`;
            const sk = paletaSkins[skinSeleccionada];
            return mezclar(sk.cabeza, sk.cuerpo, Math.min(1, i / Math.max(4, n * 0.5)));
        }
        function colorCabeza() {
            if (skinSeleccionada === 'arcoiris') return `hsl(${(tAnim * 60) % 360},80%,50%)`;
            return paletaSkins[skinSeleccionada].cabeza;
        }

        function dibujarTableroVacio() {
            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < filas; y++) {
                    ctx.fillStyle = (x + y) % 2 === 0 ? '#aad751' : '#a2d149';
                    ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                }
            }
            const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * 0.25, canvas.width / 2, canvas.height / 2, canvas.width * 0.75);
            g.addColorStop(0, 'rgba(255,255,255,0.08)');
            g.addColorStop(1, 'rgba(20,50,10,0.28)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function dibujarFruta() {
            const t = tileSize, fx = comida.x * t + t / 2;
            const bob = Math.sin(tAnim * 4) * t * 0.06;
            const pulso = 1 + Math.sin(tAnim * 5) * 0.05;
            const fy = comida.y * t + t / 2 + bob;
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            ctx.beginPath();
            ctx.ellipse(fx, comida.y * t + t * 0.88, t * 0.3 * (1 - bob / t), t * 0.09, 0, 0, Math.PI * 2);
            ctx.fill();
            const gl = ctx.createRadialGradient(fx, fy, 0, fx, fy, t * 0.8);
            gl.addColorStop(0, 'rgba(255,255,200,0.35)');
            gl.addColorStop(1, 'rgba(255,255,200,0)');
            ctx.fillStyle = gl;
            ctx.fillRect(fx - t, fy - t, t * 2, t * 2);
            ctx.translate(fx, fy);
            ctx.scale(pulso, pulso);
            ctx.font = `${t * 0.8}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emojiFrutaActual, 0, 1);
            ctx.restore();
        }

        function dibujarSerpiente() {
            const n = snakeVisual.length, t = tileSize;
            const P = i => [snakeVisual[i].x * t + t / 2, snakeVisual[i].y * t + t / 2];
            const ancho = i => t * (0.5 + 0.42 * (1 - i / Math.max(n, 6)));
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            // sombra
            for (let i = n - 1; i >= 1; i--) {
                const a = P(i), b = P(i - 1);
                ctx.strokeStyle = 'rgba(0,0,0,0.22)';
                ctx.lineWidth = ancho(i) + 2;
                ctx.beginPath(); ctx.moveTo(a[0] + 2, a[1] + 4); ctx.lineTo(b[0] + 2, b[1] + 4); ctx.stroke();
            }
            // cuerpo con borde y degradado
            for (let i = n - 1; i >= 1; i--) {
                const a = P(i), b = P(i - 1);
                ctx.strokeStyle = 'rgba(0,0,0,0.28)';
                ctx.lineWidth = ancho(i) + 3;
                ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
            }
            for (let i = n - 1; i >= 1; i--) {
                const a = P(i), b = P(i - 1);
                ctx.strokeStyle = colorSegmento(i, n);
                ctx.lineWidth = ancho(i);
                ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
            }
            // brillo superior
            for (let i = n - 1; i >= 1; i--) {
                const a = P(i), b = P(i - 1);
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = ancho(i) * 0.3;
                ctx.beginPath(); ctx.moveTo(a[0] - 1, a[1] - ancho(i) * 0.2); ctx.lineTo(b[0] - 1, b[1] - ancho(i) * 0.2); ctx.stroke();
            }
            // cabeza
            const [hx, hy] = P(0);
            const objetivo = Math.atan2(dy, dx);
            let d = objetivo - angCabeza;
            d = Math.atan2(Math.sin(d), Math.cos(d));
            angCabeza += d * 0.25;
            const rc = t * 0.46;
            ctx.save();
            ctx.translate(hx, hy);
            ctx.rotate(angCabeza);
            // lengua cuando la fruta esta cerca
            const dist = Math.hypot(comida.x - snake[0].x, comida.y - snake[0].y);
            if (dist < 4 && Math.sin(tAnim * 14) > -0.3) {
                ctx.strokeStyle = '#e53935'; ctx.lineWidth = Math.max(1.5, t * 0.07);
                ctx.beginPath(); ctx.moveTo(rc * 0.8, 0); ctx.lineTo(rc * 1.5, 0);
                ctx.lineTo(rc * 1.8, -t * 0.1); ctx.moveTo(rc * 1.5, 0); ctx.lineTo(rc * 1.8, t * 0.1); ctx.stroke();
            }
            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            ctx.beginPath(); ctx.ellipse(1, 2, rc * 1.12, rc * 1.02, 0, 0, Math.PI * 2); ctx.fill();
            const gh = ctx.createRadialGradient(-rc * 0.3, -rc * 0.35, rc * 0.1, 0, 0, rc * 1.1);
            gh.addColorStop(0, 'rgba(255,255,255,0.35)');
            gh.addColorStop(0.4, colorCabeza());
            gh.addColorStop(1, colorCabeza());
            ctx.fillStyle = colorCabeza();
            ctx.beginPath(); ctx.ellipse(0, 0, rc * 1.08, rc, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = gh;
            ctx.beginPath(); ctx.ellipse(0, 0, rc * 1.08, rc, 0, 0, Math.PI * 2); ctx.fill();
            // ojos
            const ex = rc * 0.35, ey = rc * 0.52, er = rc * 0.32;
            for (const sg of [-1, 1]) {
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(ex, ey * sg, er, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(ex + er * 0.3, ey * sg, er * 0.55, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(ex + er * 0.45, ey * sg - er * 0.2, er * 0.18, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function dibujarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx * 0.016; p.y += p.vy * 0.016;
                p.vx *= 0.94; p.vy *= 0.94; p.vida -= 0.035;
                if (p.vida <= 0) { particulas.splice(i, 1); continue; }
                ctx.globalAlpha = p.vida;
                ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.vida, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function dibujarEscenario() {
            tAnim += 0.016;
            dibujarTableroVacio();
            dibujarFruta();
            dibujarSerpiente();
            dibujarParticulas();
        }

        function flashMuerte() {
            dibujarEscenario();
            ctx.fillStyle = 'rgba(200,30,30,0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvas.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(0)' }], { duration: 350 });
        }

        function generarComida() {
            comida.x = Math.floor(Math.random() * cols);
            comida.y = Math.floor(Math.random() * filas);

            snake.forEach(parte => {
                if (parte.x === comida.x && parte.y === comida.y) {
                    generarComida();
                }
            });
        }

        function verificarGameOver() {
            const cabeza = snake[0];
            if (cabeza.x < 0 || cabeza.x >= cols || cabeza.y < 0 || cabeza.y >= filas) return true;
            for (let i = 1; i < snake.length; i++) {
                if (cabeza.x === snake[i].x && cabeza.y === snake[i].y) return true;
            }
            return false;
        }

        dibujarTableroVacio();

        document.addEventListener('keydown', e => {
            if (!juegoEnCurso) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { proximoDx = 0; proximoDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { proximoDx = 0; proximoDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { proximoDx = -1; proximoDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { proximoDx = 1; proximoDy = 0; }
                    break;
            }
        });
    
        /* ===== Control táctil: desliza el dedo para girar ===== */
        function girarSnake(k) {
            if (!juegoEnCurso) return;
            if (k === 'U' && dy === 0) { proximoDx = 0; proximoDy = -1; }
            else if (k === 'D' && dy === 0) { proximoDx = 0; proximoDy = 1; }
            else if (k === 'L' && dx === 0) { proximoDx = -1; proximoDy = 0; }
            else if (k === 'R' && dx === 0) { proximoDx = 1; proximoDy = 0; }
        }
        let swipeSnake = null;
        document.addEventListener('touchstart', e => {
            if (!juegoEnCurso || e.touches.length !== 1 || (e.target.closest && e.target.closest('button,select,a'))) { swipeSnake = null; return; }
            swipeSnake = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!swipeSnake || !juegoEnCurso) return;
            e.preventDefault();
            const t = e.touches[0], mx = t.clientX - swipeSnake.x, my = t.clientY - swipeSnake.y;
            if (Math.max(Math.abs(mx), Math.abs(my)) < 20) return;
            girarSnake(Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 'R' : 'L') : (my > 0 ? 'D' : 'U'));
            swipeSnake.x = t.clientX; swipeSnake.y = t.clientY;
        }, { passive: false });
        document.addEventListener('touchend', () => { swipeSnake = null; }, { passive: true });
    </script>
</body>
</html>
