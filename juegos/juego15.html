<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NexGame Dash - NexGame</title>
<style>
:root{--ac:#36f1ff;--ac2:#ff4fa3;--bg:#07070f;--gold:#ffd24c}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:'Trebuchet MS','Segoe UI',Tahoma,sans-serif;overscroll-behavior:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.screen.on{display:flex}
.top{width:100%;display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.top .sp{flex:1}
.moneda{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:20px;font-weight:800;font-size:.9rem;white-space:nowrap}
.btn{background:linear-gradient(#3b4a6b,#232c44);border:2px solid #0a0e1a;box-shadow:0 3px 0 #0a0e1a,inset 0 2px 0 rgba(255,255,255,.2);color:#fff;font-weight:900;padding:10px 18px;border-radius:10px;font-size:1rem;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0e1a}
.btn.g{background:linear-gradient(#6cff3c,#25a800)}
.btn.o{background:linear-gradient(#ffb43c,#d86a00)}
.btn.r{background:linear-gradient(#ff5a5a,#b01616)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.back{width:46px;height:46px;border-radius:50%;padding:0;font-size:1.3rem}
a.back{display:flex;align-items:center;justify-content:center;text-decoration:none}

/* principal */
#s-main{align-items:center;justify-content:center;gap:16px;text-align:center}
#titulo{font-size:clamp(2.2rem,8vw,5rem);font-weight:900;font-style:italic;letter-spacing:2px;background:linear-gradient(#fff,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px rgba(54,241,255,.5))}
#titulo small{display:block;font-size:.3em;letter-spacing:6px;color:#fff;-webkit-text-fill-color:#fff;font-style:normal;margin-top:-4px}
.fila-menu{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,34px)}
.big{width:clamp(96px,22vh,150px);height:clamp(96px,22vh,150px);border-radius:50%;font-size:clamp(2.4rem,9vh,4rem);padding:0;display:flex;align-items:center;justify-content:center;line-height:1}
.med{width:clamp(70px,15vh,96px);height:clamp(70px,15vh,96px);border-radius:16px;padding:6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.med span{font-size:clamp(1.5rem,5vh,2.2rem)}
.pie-menu{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#8d92b0;font-size:.74rem}

/* niveles */
#s-lv{align-items:center}
#lv-wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;min-height:0;padding:0 6px}
.flecha{width:clamp(44px,8vw,70px);height:clamp(70px,16vh,110px);font-size:2.4rem;border-radius:14px;padding:0;flex:none}
#lv-card{flex:1;max-width:640px;max-height:100%;background:linear-gradient(rgba(14,14,30,.88),rgba(8,8,18,.92));border:3px solid var(--lc,#4f8bff);border-radius:18px;padding:16px 20px;text-align:center;box-shadow:0 0 40px color-mix(in srgb,var(--lc,#4f8bff) 45%,transparent);overflow-y:auto}
#lv-nombre{font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;text-shadow:0 3px 0 #000}
#lv-dif{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 8px;font-weight:800}
#lv-cara{font-size:2.6rem}
#lv-meta{color:#aab;font-size:.82rem;margin-bottom:8px}
.barra{height:20px;border-radius:10px;background:#000;border:2px solid #000;position:relative;margin:4px 0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.barra i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#6cff3c,#27b000)}
.barra.p i{background:linear-gradient(#5ac8ff,#1b6fe0)}
.barra b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;text-shadow:0 1px 2px #000}
.lbl{font-size:.74rem;color:#bbc;text-align:left;margin-top:6px}
#lv-coins{display:flex;gap:10px;justify-content:center;margin:8px 0;font-size:1.7rem}
#lv-coins span.off{filter:grayscale(1) brightness(.4)}
#lv-acc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;border:2px solid transparent}
.chk.on{border-color:#6cff3c;background:rgba(108,255,60,.14)}
#lv-pts{text-align:center;color:#8d92b0;font-size:.74rem;padding:4px 0 10px}

/* personalizar */
#cu-body{flex:1;display:flex;gap:14px;padding:0 14px 12px;min-height:0}
#cu-prev{flex:0 0 min(30%,260px);display:flex;flex-direction:column;align-items:center;gap:10px}
#cu-cv{width:100%;aspect-ratio:1;max-width:220px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.15);border-radius:16px}
#cu-main{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#1b2236;border:2px solid #0a0e1a;color:#aab;border-radius:9px;padding:8px 12px;font-weight:800;font-size:.85rem}
.tab.on{background:linear-gradient(#3b8bff,#1d4fb3);color:#fff}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;align-content:start;padding:2px 2px 8px;min-height:0}
.it{position:relative;aspect-ratio:1;background:rgba(0,0,0,.45);border:3px solid transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.it canvas{width:80%;height:80%}
.it.sel{border-color:#fff;box-shadow:0 0 14px #fff}
.it.lock canvas{filter:brightness(.35)}
.it.lock::after{content:'🔒';position:absolute;font-size:1.2rem}
.sw2{aspect-ratio:1;border-radius:8px;border:3px solid rgba(0,0,0,.6);cursor:pointer;position:relative}
.sw2.sel{border-color:#fff;box-shadow:0 0 12px #fff}
.sw2.lock::after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:5px}
.sub{font-size:.78rem;color:#9aa;font-weight:800;margin:4px 0 2px}

/* tiendas */
#sh-tabs{padding:0 14px}
#sh-list{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:12px 14px 18px;align-content:start;min-height:0}
.prod{background:rgba(10,12,26,.82);border:2px solid #2a3150;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.prod canvas{width:64px;height:64px}
.prod b{font-size:.78rem}
.prod .btn{width:100%;padding:7px 4px;font-size:.82rem}
.prod.owned{opacity:.55}
.tendero{padding:4px 14px 8px;color:#bcc;font-size:.82rem;font-style:italic}

/* cofres */
#ch-body{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,60px);padding:10px;flex-wrap:wrap}
.cofre{width:min(260px,42vw);background:rgba(10,12,26,.82);border:3px solid var(--cc);border-radius:18px;padding:16px;text-align:center;box-shadow:0 0 32px color-mix(in srgb,var(--cc) 40%,transparent)}
.cofre .ico{font-size:clamp(3rem,12vh,5rem);line-height:1.1}
.cofre h3{margin:4px 0}
.cofre .tm{color:#bcd;margin:6px 0 10px;font-weight:800;font-variant-numeric:tabular-nums;min-height:1.4em}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:12px}
#modal.on{display:flex}
#modal-c{background:linear-gradient(#1b2236,#0e1322);border:3px solid #3a4670;border-radius:16px;padding:20px;max-width:min(520px,94vw);max-height:90vh;overflow-y:auto;text-align:center;box-shadow:0 0 50px rgba(0,0,0,.8)}
#modal-c h3{margin-bottom:10px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;font-weight:800;text-align:left}
.fila input[type=range]{flex:1;max-width:260px}
.rew{font-size:1.3rem;margin:6px 0;font-weight:900}

/* juego */
#hud{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}
#hud.on{display:block}
#h-bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);width:min(380px,50vw);height:14px;background:rgba(0,0,0,.55);border:2px solid #000;border-radius:8px;overflow:hidden}
#h-bar i{display:block;height:100%;width:0;background:linear-gradient(#6cff3c,#27b000)}
#h-pct{position:absolute;top:calc(8px + env(safe-area-inset-top,0));left:calc(50% + min(190px,25vw) + 12px);font-weight:900;text-shadow:0 2px 0 #000;font-size:1rem}
#h-pausa{position:absolute;top:calc(8px + env(safe-area-inset-top,0));right:calc(12px + env(safe-area-inset-right,0));width:52px;height:52px;pointer-events:auto;font-size:1.2rem;padding:0;border-radius:14px}
#h-prac{position:absolute;top:calc(10px + env(safe-area-inset-top,0));left:calc(14px + env(safe-area-inset-left,0));font-weight:900;color:#6cff3c;text-shadow:0 2px 0 #000;display:none}
#h-intento{position:absolute;bottom:10px;left:14px;font-weight:800;font-size:.8rem;color:#ccd;text-shadow:0 2px 0 #000}
#pausa,#fin{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.66);text-align:center;padding:12px}
#pausa.on,#fin.on{display:flex}
#pausa h2,#fin h2{font-size:2rem;text-shadow:0 3px 0 #000}
.fila-b{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#girar{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#07070f;font-size:1.1rem;text-align:center;padding:20px}
@media (orientation:portrait) and (pointer:coarse){#girar{display:flex}}
@media (max-height:480px){.top{padding:6px 10px}#lv-card{padding:8px 14px}#lv-cara{font-size:2rem}.big{width:84px;height:84px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="screen on" id="s-main">

<!-- Tiendas -->
<div class="screen" id="s-sh">
  <div class="top"><button class="btn back" data-ir="s-main">←</button><div class="tabs" id="sh-tabs"></div><span class="sp"></span><div class="moneda" id="m-sh"></div></div>

<!-- Cofres -->

  <div id="ch-body"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="h-prac">◆ MODO PRÁCTICA</div>
  <div id="h-bar"><i></i></div><div id="h-pct">0%</div>
  <button class="btn" id="h-pausa">❚❚</button>
  <div id="h-intento"></div>
</div>
<div id="pausa"><h2>Pausa</h2><div class="fila-b"><button class="btn g" id="p-seguir">Continuar</button><button class="btn o" id="p-reiniciar">Reiniciar</button><button class="btn r" id="p-salir">Salir</button></div></div>
<div id="fin"><h2 id="fin-t">¡Nivel completado!</h2><div id="fin-r"></div><div class="fila-b"><button class="btn g" id="f-otra">Reintentar</button><button class="btn" id="f-niv">Niveles</button></div></div>
<div id="modal"><div id="modal-c"></div></div>

<script src="juego14-temas.js" onerror="void 0"></script>
<script>
(() => {
'use strict';
/*ENGINE_START*/
const VIEW_H = 11, CEIL = 10, SPD = 10.4, GRAV = 67, JV = 16.8, DT = 1 / 120;
const SPEEDS = [0.8, 1, 1.25, 1.6];
function rngS(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- construcción de niveles ---------- */
function newLevel() { return { cells: new Map(), haz: new Map(), items: [], itemCol: new Map(), ceilOn: [], end: 0, coinSpots: [], nid: 0 }; }
const addTo = (m, x, v) => { let a = m.get(x); if (!a) { a = []; m.set(x, a); } a.push(v); };
const B = (L, x, y) => addTo(L.cells, x, y);
const SPK = (L, x, y, down) => addTo(L.haz, x, { t: down ? 'spkd' : 'spk', x, y });
function SAW(L, x, y, r) { const o = { t: 'saw', x, y, r }; for (let c = Math.floor(x - r); c <= Math.floor(x + r); c++) addTo(L.haz, c, o); }
function IT(L, o) { o.id = L.nid++; L.items.push(o); addTo(L.itemCol, Math.floor(o.x), o); return o; }
const CEILRANGE = (L, a, b) => { for (let x = Math.floor(a); x <= Math.ceil(b); x++) L.ceilOn[x] = true; };

/* patrones de cubo (suelo) */
function pSpikes(L, x, r, d) {
  const n = d <= 1 ? 1 + (r() < .4 ? 1 : 0) : 1 + Math.floor(r() * (d >= 3 ? 3 : 2));
  for (let i = 0; i < n; i++) SPK(L, x + i, 0, false);
  L.coinSpots.push([x + n / 2 - 0.5, 2.1]); return n;
}
function pPlatform(L, x, r, d) {
  const h = (d >= 3 && r() < .4) ? 2 : 1, len = 3 + Math.floor(r() * 5);
  for (let i = 0; i < len; i++) for (let y = 0; y < h; y++) B(L, x + i, y);
  if (d >= 2 && r() < .6) SPK(L, x + len - 1, h, false);
  if (d >= 3 && r() < .5) { SPK(L, x + len, 0, false); SPK(L, x + len + 1, 0, false); return len + 2; }
  L.coinSpots.push([x + len / 2, h + 1.6]); return len;
}
function pOrbs(L, x, r, d) {
  const n = 5 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++) SPK(L, x + 1 + i, 0, false);
  IT(L, { t: 'orb', c: 'y', x: x + 1 + n / 2 - 0.5, y: 2.4 }); L.coinSpots.push([x + n / 2 + 1, 3.6]); return n + 2;
}
function pPad(L, x, r, d) {
  IT(L, { t: 'pad', c: 'y', x, y: 0 });
  const n = 3 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++) SPK(L, x + 4 + i, 0, false);
  L.coinSpots.push([x + 5, 3.4]); return n + 4;
}
function pStairs(L, x, r, d) {
  const hs = r() < .5 ? [1, 2, 1] : [1, 1, 2, 2, 1]; let i = 0;
  hs.forEach(h => { for (let y = 0; y < h; y++) B(L, x + i, y); i++; });
  if (d >= 4) SPK(L, x + i, 0, false);
  return i + (d >= 4 ? 1 : 0);
}
function pSaw(L, x, r, d) { SAW(L, x + 1, 1.2, 0.9); L.coinSpots.push([x + 1, 3]); return 3; }
function pDouble(L, x, r, d) { SPK(L, x, 0, false); SPK(L, x + 3, 0, false); SPK(L, x + 4, 0, false); return 5; }
function cubeSection(L, x0, len, d, r) {
  let x = x0 + 10; const end = x0 + len;
  while (x < end - 12) {
    const p = r(); let used;
    if (p < 0.28) used = pSpikes(L, x, r, d);
    else if (p < 0.46) used = pPlatform(L, x, r, d);
    else if (p < 0.60) used = d >= 2 ? pOrbs(L, x, r, d) : pSpikes(L, x, r, d);
    else if (p < 0.72) used = pPad(L, x, r, d);
    else if (p < 0.82 && d >= 2) used = pStairs(L, x, r, d);
    else if (p < 0.90 && d >= 4) used = pSaw(L, x, r, d);
    else if (p < 0.96 && d >= 3) used = pDouble(L, x, r, d);
    else used = pSpikes(L, x, r, d);
    x += used + Math.round(6.5 + (6 - d) * 0.9 + r() * 3);
  }
  return end;
}
/* pasillos: nave / ovni / onda */
function corridor(L, x0, len, cFn, gFn) {
  for (let i = 0; i < len; i++) {
    const x = x0 + i, c = cFn(i), g = gFn(i);
    const fl = Math.max(0, Math.round(c - g / 2)), cl = Math.min(CEIL, fl + Math.ceil(g));
    for (let y = 0; y < fl; y++) B(L, x, y);
    for (let y = cl; y < CEIL; y++) B(L, x, y);
    L.ceilOn[x] = true;
  }
}
function flightSection(L, x0, len, d, r, kind) {
  const base = kind === 'ufo' ? 6.4 : 6.2, g = Math.max(kind === 'ufo' ? 5 : 4.4, base - (d - 1) * 0.4), ms = kind === 'ufo' ? 0.32 : 0.5, ramp = 10;
  const pts = []; let c = 5, i = 0;
  const lo = g / 2 + 0.2, hi = CEIL - g / 2 - 0.2;
  pts.push([0, 5]);
  while (i < len - 2 * ramp) {
    const tgt = lo + r() * (hi - lo), seg = Math.max(7, Math.ceil(Math.abs(tgt - c) / ms)) + Math.floor(r() * 4);
    i += seg; pts.push([i, tgt]); c = tgt;
  }
  const cAt = k => { const kk = Math.max(0, k - ramp); let a = pts[0], b = pts[pts.length - 1]; for (let j = 0; j < pts.length - 1; j++) if (kk >= pts[j][0] && kk <= pts[j + 1][0]) { a = pts[j]; b = pts[j + 1]; break; } if (kk >= pts[pts.length - 1][0]) return pts[pts.length - 1][1]; return a[1] + (b[1] - a[1]) * (kk - a[0]) / Math.max(1, b[0] - a[0]); };
  const gAt = k => { const e = Math.min(k, len - k); return e >= ramp ? g : CEIL - (CEIL - g) * (e / ramp); };

        if (!next.has(key)) next.set(key, Q);

}

/* ================= Bucle ================= */
function actualizar(dt) {
  bgT += dt;
  if (estado === 'play') {
    partidaT += dt; acc += dt; let n = 0;
    while (acc >= DT && n < 40) {
      stepP(LV, P, DT, hold, evento); acc -= DT; n++;
      if (estado !== 'play') break;
    }
    if (estado === 'play') {
      trailT += dt; if (trailT > 0.016) { trailT = 0; trail.push({ x: P.x, y: P.y, a: 1, r: P.rot }); if (trail.length > 40) trail.shift(); }
      if (practica) { cpT += dt; if (cpT >= 2.4 && P.og) { cpT = 0; cps.push({ P: clonePlayer(P), t: P.t, coins: gotCoins.slice() }); if (cps.length > 30) cps.shift(); } }
      const p = pct(); $('h-bar').firstElementChild.style.width = p + '%'; $('h-pct').textContent = Math.floor(p) + '%';
    }
  } else if (estado === 'dead') {
    muerteT += dt;
    if (muerteT > 0.95) { intentos++; reaparecer(false); }
  } else if (estado === 'win') { /* sigue animando partículas */ }
  trail.forEach(t => t.a -= dt * 3.2); trail = trail.filter(t => t.a > 0);
  for (const p of particulas) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= (p.t === 2 ? 9 : 14) * dt; p.life -= dt; }
  particulas = particulas.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
}

function infoDe(key) { const it = CATALOGO.find(c => c.key === key); return it ? `Se compra en la tienda ${TIENDAS.find(t => t.id === it.shop).n.replace(/^\S+\s/, '')} por ${it.price} ${MONEDA[it.shop]}` : ''; }
function toastInfo(key) { $('cu-info').textContent = '🔒 ' + infoDe(key); }
const cuC = $('cu-cv'), cuG = cuC.getContext('2d');
function cuAnim() {
  if (!$('s-cu').classList.contains('on')) return;
  const m = MODOS.find(x => x[0] === cuTab) ? cuTab : 'cube', t = bgT;
  cuG.setTransform(1, 0, 0, 1, 0, 0); cuG.clearRect(0, 0, 360, 360); cuG.translate(180, 180);
  cuG.rotate(m === 'cube' || m === 'ball' ? t * 2 : Math.sin(t * 2) * 0.25); if (S.glow) { cuG.shadowColor = COLORS[S.c1]; cuG.shadowBlur = 24; }
  drawIcon(cuG, m, S.icons[m], COLORS[S.c1], COLORS[S.c2], 190);
}

/* ================= Tiendas ================= */
let shTab = 'orbs';
function shPintar() {
  const tabs = $('sh-tabs'); tabs.innerHTML = '';
  TIENDAS.forEach(t => { const b = el('button', 'tab' + (shTab === t.id ? ' on' : ''), t.n); b.onclick = () => { shTab = t.id; sfx('click'); shPintar(); }; tabs.appendChild(b); });
  $('sh-tend').textContent = TIENDAS.find(t => t.id === shTab).t;
  const l = $('sh-list'); l.innerHTML = '';
  CATALOGO.filter(c => c.shop === shTab).forEach(c => {
    const p = el('div', 'prod' + (S.own[c.key] ? ' owned' : '')); let nombre, vista;
    if (c.tipo === 'ic') { nombre = `${MODOS.find(m => m[0] === c.modo)[1]} #${c.idx + 1}`; vista = iconCanvas(c.modo, c.idx, COLORS[S.c1], COLORS[S.c2], 128); }
    else if (c.tipo === 'co') { nombre = 'Color #' + (c.idx + 1); vista = el('canvas'); vista.width = vista.height = 64; const x = vista.getContext('2d'); x.fillStyle = COLORS[c.idx]; x.beginPath(); x.arc(32, 32, 28, 0, 7); x.fill(); x.strokeStyle = '#000'; x.lineWidth = 4; x.stroke(); }
    else { nombre = c.tipo === 'tr' ? 'Estela: ' + TRAILS[c.idx] : c.tipo === 'de' ? 'Muerte: ' + DEATHS[c.idx] : 'Brillo de icono'; vista = el('div', '', c.tipo === 'tr' ? '✨' : c.tipo === 'de' ? '💥' : '🌟'); vista.style.fontSize = '2.6rem'; vista.style.height = '64px'; }
    p.appendChild(vista); p.appendChild(el('b', '', esc(nombre)));
    const b = el('button', 'btn sm ' + (S.own[c.key] ? '' : 'g'), S.own[c.key] ? 'Comprado' : `${c.price} ${MONEDA[c.shop]}`);
    if (S.own[c.key]) b.disabled = true; else b.onclick = () => comprar(c);
    p.appendChild(b); l.appendChild(p);
  });
}
function comprar(c) {
  if (S[c.shop] < c.price) { sfx('no'); modal(`<h3>Faltan ${MONEDA[c.shop]}</h3><p>Necesitas ${c.price} ${MONEDA[c.shop]} y tienes ${S[c.shop]}.</p><br><button class="btn" onclick="document.getElementById('modal').classList.remove('on')">Vale</button>`); return; }
  S[c.shop] -= c.price; S.own[c.key] = 1; guardar(); sfx('buy'); monedasPintar(); shPintar();
}
function modal(html) { $('modal-c').innerHTML = html; $('modal').classList.add('on'); }
$('modal').addEventListener('pointerdown', e => { if (e.target === $('modal')) $('modal').classList.remove('on'); });

/* ================= Cofres ================= */
const CH = [
  { id: 'chD', n: 'Cofre diario', ico: '🎁', ms: 24 * 3600e3, c: '#ffd24c' },
  { id: 'chW', n: 'Cofre semanal', ico: '💎', ms: 7 * 24 * 3600e3, c: '#c04bff' }
];
function chPintar() {
  const b = $('ch-body'); b.innerHTML = '';
  CH.forEach(c => {
    const d = el('div', 'cofre'); d.style.setProperty('--cc', c.c);
    d.innerHTML = `<div class="ico">${c.ico}</div><h3>${c.n}</h3><div class="tm" id="tm-${c.id}"></div>`;
    const bt = el('button', 'btn g', 'ABRIR'); bt.id = 'bt-' + c.id; bt.onclick = () => abrirCofre(c); d.appendChild(bt); b.appendChild(d);
  });
  chTick();
}
function chTick() {
  if (!$('s-ch').classList.contains('on')) return;
  CH.forEach(c => { const rest = S[c.id] - Date.now(), t = $('tm-' + c.id), b = $('bt-' + c.id); if (!t) return; if (rest <= 0) { t.textContent = '¡Listo para abrir!'; b.disabled = false; } else { const h = Math.floor(rest / 3600e3), m = Math.floor(rest % 3600e3 / 60e3), s = Math.floor(rest % 60e3 / 1000); t.textContent = (h >= 24 ? Math.floor(h / 24) + 'd ' : '') + String(h % 24).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); b.disabled = true; } });
}
setInterval(chTick, 500);
function abrirCofre(c) {
  if (S[c.id] > Date.now()) return; const sem = c.id === 'chW', R = Math.random;
  const orbs = Math.round((sem ? 500 : 60) + R() * (sem ? 1000 : 240)), diam = Math.round((sem ? 5 : 1) + R() * (sem ? 10 : 3));
  S.orbs += orbs; S.diam += diam; let extra = '';
  if (R() < (sem ? 0.6 : 0.2)) { const m = sem ? 'gold' : (R() < .5 ? 'gold' : 'silver'), n = sem ? 3 + Math.floor(R() * 6) : 1 + Math.floor(R() * 2); S[m] += n; extra += `<div class="rew">${MONEDA[m]} +${n}</div>`; }
  if (R() < (sem ? 0.5 : 0.12)) { const lib = CATALOGO.filter(x => !S.own[x.key]); if (lib.length) { const it = lib[Math.floor(R() * lib.length)]; S.own[it.key] = 1; const nom = it.tipo === 'ic' ? 'Icono de ' + MODOS.find(m => m[0] === it.modo)[1] : it.tipo === 'co' ? 'Color' : it.tipo === 'tr' ? 'Estela' : it.tipo === 'de' ? 'Efecto de muerte' : 'Brillo'; extra += `<div class="rew">🎉 ¡Desbloqueado: ${nom}!</div>`; } }
  S[c.id] = Date.now() + c.ms; guardar(); sfx('win'); monedasPintar();
  modal(`<h3>${c.ico} ${c.n}</h3><div class="rew">🔵 +${orbs}</div><div class="rew">💎 +${diam}</div>${extra}<br><button class="btn g" onclick="document.getElementById('modal').classList.remove('on')">¡Genial!</button>`);
  chTick();
}

/* ================= Ajustes ================= */
$('b-set').onclick = () => {
  unlockAudio(); sfx('click');
  modal(`<h3>⚙ Ajustes</h3><div class="fila">Música <input type="range" min="0" max="100" value="${S.vm}" id="st-m"></div><div class="fila">Efectos <input type="range" min="0" max="100" value="${S.vs}" id="st-s"></div><div class="fila" style="justify-content:center"><button class="btn r sm" id="st-reset">Borrar todo el progreso</button></div><button class="btn g" id="st-ok">Cerrar</button>`);
  $('st-m').oninput = e => { S.vm = +e.target.value; volAplicar(); guardar(); }; $('st-s').oninput = e => { S.vs = +e.target.value; volAplicar(); guardar(); };
  $('st-ok').onclick = () => $('modal').classList.remove('on');
  $('st-reset').onclick = () => { if (confirm('¿Seguro? Se perderán iconos, monedas y progreso.')) { S = JSON.parse(JSON.stringify(DEF_SAVE)); guardar(); location.reload(); } };
};
$('b-play').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-lv'); };
$('b-custom').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-cu'); };
$('b-shop').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-sh'); };
$('b-chest').onclick = () => { unlockAudio(); sfx('click'); mostrar('s-ch'); };

/* ================= Inicio ================= */
monedasPintar(); requestAnimationFrame(bucle);

})();
</script>
</body>
