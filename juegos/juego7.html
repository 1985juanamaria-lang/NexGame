<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pachinko - aldGAME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Panel Lateral */
        .panel-lateral {
            width: 320px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        .panel-lateral h2 {
            font-size: 1.4rem;
            color: #e94560;
            margin-bottom: 6px;
        }

        .info-estado {
            font-size: 0.9rem;
            background: #2b2b2b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Caja de Dinero propia del Pachinko */
        .caja-saldo {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        .caja-saldo span {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .caja-saldo strong {
            font-size: 1.4rem;
            color: #f1c40f;
        }

        /* Selector de Apuesta */
        .selector-apuesta {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .selector-apuesta span {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .botones-apuesta {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-apuesta {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-apuesta.activo {
            background: #e94560;
            border-color: #e94560;
        }

        /* Contenedor principal del juego (Centrado absoluto) */
        .contenedor-juego {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 15px;
        }

        /* Tablero Pachinko */
        .tablero-pachinko {
            position: relative;
            width: 420px;
            height: 520px;
            background-color: #181818;
            border: 3px solid #0f3460;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #e94560;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Estilo de Bola Metálica Realista */
        .bola {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 4px 4px, #ffffff, #aaaaaa 40%, #444444 80%, #111111 100%);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.7);
            transform: translate(-50%, -50%);
        }

        .ranuras {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            display: flex;
            background: #111;
            border-top: 2px solid #333;
        }

        .ranura {
            flex: 1;
            border-right: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Colores llamativos para cada multiplicador */
        .ranura-10 { color: #f1c40f; background: rgba(241, 196, 15, 0.15); } /* Amarillo Dorado */
        .ranura-5  { color: #2ecc71; background: rgba(46, 204, 113, 0.15); } /* Verde Neón */
        .ranura-2  { color: #3498db; background: rgba(52, 152, 219, 0.15); } /* Azul Brillante */
        .ranura-1  { color: #e74c3c; background: rgba(231, 76, 60, 0.15); }  /* Rojo Intenso */

        /* Botones */
        .botones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #cf3a53;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .btn-volver {
            background-color: #444;
        }

        .btn-volver:hover {
            background-color: #555;
        }
    </style>
<style id="nexgame-theme">
/* ===== NexGame · tema común ===== */
:root{--nx-bg:#0b0d12;--nx-surface:#12151c;--nx-surface2:#181c25;--nx-line:#232836;--nx-text:#e8eaf0;--nx-muted:#8b92a5;--nx-accent:#ff4757;--nx-ok:#35d07f;--nx-bad:#ff5c6c;--nx-warn:#f5c451}
body{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif !important;background:var(--nx-bg) !important;color:var(--nx-text) !important;-webkit-font-smoothing:antialiased}
.panel-lateral{width:300px;background:var(--nx-surface);border-right:1px solid var(--nx-line);padding:26px 20px}
.panel-lateral h2{font-size:1.2rem;font-weight:700;color:var(--nx-text);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--nx-line);letter-spacing:.2px}
.panel-lateral h2::before{content:'NEXGAME';display:block;font-size:.62rem;letter-spacing:3px;color:var(--nx-accent);font-weight:800;margin-bottom:7px}
.info-estado,.info-turno{background:var(--nx-surface2);border:1px solid var(--nx-line);border-radius:10px;padding:12px 14px;font-size:.88rem;font-weight:600;color:var(--nx-text);line-height:1.35}
.puntuacion-contenedor{gap:10px}
.caja-puntos,.caja-saldo,.selector-apuesta{background:var(--nx-surface2);border:1px solid var(--nx-line);border-radius:10px}
.caja-puntos span,.caja-saldo span,.selector-apuesta span{color:var(--nx-muted);font-size:.64rem;letter-spacing:1.4px;font-weight:700}
.caja-puntos strong,.caja-saldo strong{color:var(--nx-text);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.caja-saldo strong{color:var(--nx-warn)}
.seccion-historial{background:var(--nx-surface2);border:1px solid var(--nx-line);border-radius:10px;padding:12px}
.seccion-historial h3{color:var(--nx-muted);font-size:.64rem;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;margin-bottom:8px;text-align:left}
.lista-partidas li{border-bottom:1px solid var(--nx-line);padding:7px 2px;color:var(--nx-muted)}
.tag-victoria,.tag-ganada{color:var(--nx-ok) !important}.tag-derrota,.tag-perdida{color:var(--nx-bad) !important}.tag-empate{color:var(--nx-warn) !important}.tag-puntos{color:var(--nx-text) !important}
.btn{background:var(--nx-accent);color:#fff;border:1px solid transparent;border-radius:10px;padding:12px 16px;font-size:.9rem;font-weight:600;letter-spacing:.2px;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:#ff6070}.btn:active{transform:translateY(1px)}
.btn-volver,.btn-secundario{background:transparent !important;border:1px solid var(--nx-line) !important;color:var(--nx-muted) !important}
.btn-volver:hover,.btn-secundario:hover{border-color:#3a4258 !important;color:var(--nx-text) !important;background:var(--nx-surface2) !important}
.btn:disabled{background:#262b38;color:#6b7387}
.contenedor-juego{background:radial-gradient(800px 500px at 50% 0%,#141826 0%,transparent 70%)}

.tablero-pachinko{background:linear-gradient(180deg,#0e121c,#0a0d15);border:1px solid var(--nx-line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.pin{width:10px;height:10px;background:#8ea0c9;box-shadow:0 0 8px rgba(142,160,201,.45)}
.ranuras{background:#0a0d14;border-top:1px solid var(--nx-line)}
.ranura{border-right:1px solid #1a2030;font-weight:800;font-size:.8rem}
.btn-apuesta{background:var(--nx-surface);border:1px solid var(--nx-line);border-radius:8px;color:var(--nx-text);padding:7px 12px}
.btn-apuesta:hover{border-color:#3a4258}
.btn-apuesta.activo{background:var(--nx-accent);border-color:var(--nx-accent)}
#btn-lanzar{border-radius:12px}
</style>
</head>
<body>

    <!-- Panel Lateral -->
    <div class="panel-lateral">
        <div>
            <h2>Pachinko aldGAME</h2>
            <div class="info-estado" id="info-estado">¡Selecciona apuesta y lanza!</div>

            <!-- Caja de Dinero propia del Pachinko -->
            <div class="caja-saldo">
                <span>Dinero de Pachinko</span>
                <strong id="saldo-actual">$1000</strong>
            </div>

            <!-- Selector de Apuesta -->
            <div class="selector-apuesta">
                <span>Apuesta por bola</span>
                <div class="botones-apuesta">
                    <button class="btn-apuesta activo" onclick="cambiarApuesta(10)">$10</button>
                    <button class="btn-apuesta" onclick="cambiarApuesta(25)">$25</button>
                    <button class="btn-apuesta" onclick="cambiarApuesta(50)">$50</button>
                    <button class="btn-apuesta" onclick="cambiarApuesta(100)">$100</button>
                </div>
            </div>
        </div>

        <div class="botones">
            <a href="../index.html" class="btn btn-volver">Volver al Menú</a>
        </div>
    </div>

    <!-- Contenedor del Juego -->
    <div class="contenedor-juego">
        <div class="tablero-pachinko" id="tablero">
            <div class="ranuras">
                <div class="ranura ranura-10">x10</div>
                <div class="ranura ranura-5">x5</div>
                <div class="ranura ranura-2">x2</div>
                <div class="ranura ranura-1">x1</div>
                <div class="ranura ranura-2">x2</div>
                <div class="ranura ranura-5">x5</div>
                <div class="ranura ranura-10">x10</div>
            </div>
        </div>
        <button class="btn" id="btn-lanzar" onclick="lanzarBola()" style="width: 420px; padding: 12px;">Lanzar Bola</button>
    </div>

    <script>
        // Sistema de Dinero independiente exclusivo para Pachinko
        let saldo = parseInt(localStorage.getItem('pachinko_dinero'));
        if (isNaN(saldo)) {
            saldo = 1000;
            localStorage.setItem('pachinko_dinero', saldo);
        }

        let apuestaActual = 10;

        function actualizarSaldoUI() {
            document.getElementById('saldo-actual').textContent = `$${saldo}`;
            localStorage.setItem('pachinko_dinero', saldo);
        }
        actualizarSaldoUI();

        function cambiarApuesta(valor) {
            apuestaActual = valor;
            document.querySelectorAll('.btn-apuesta').forEach(btn => {
                btn.classList.remove('activo');
                if (parseInt(btn.textContent.replace('$', '')) === valor) {
                    btn.classList.add('activo');
                }
            });
        }

        const tablero = document.getElementById('tablero');
        const multiplicadores = [10, 5, 2, 1, 2, 5, 10];
        let pins = [];

        // Generar estructura de pines más estrecha
        function generarPines() {
            const filas = 7;
            for (let f = 0; f < filas; f++) {
                let numPines = f + 3;
                let espacioY = 45 + f * 55;
                let separacionX = 32; 
                let anchoTotal = numPines * separacionX;
                let inicioX = (420 - anchoTotal) / 2 + (separacionX / 2);

                for (let p = 0; p < numPines; p++) {
                    let pin = document.createElement('div');
                    pin.classList.add('pin');
                    let x = inicioX + p * separacionX;
                    let y = espacioY;
                    pin.style.left = `${x}px`;
                    pin.style.top = `${y}px`;
                    tablero.appendChild(pin);
                    pins.push({x, y});
                }
            }
        }
        generarPines();

        function lanzarBola() {
            if (saldo < apuestaActual) {
                document.getElementById('info-estado').textContent = "⚠️ ¡No tienes suficiente dinero en Pachinko!";
                return;
            }

            saldo -= apuestaActual;
            actualizarSaldoUI();

            let bolaEl = document.createElement('div');
            bolaEl.classList.add('bola');
            tablero.appendChild(bolaEl);

            let x = 210 + (Math.random() * 4 - 2); 
            let y = 15;
            let velocidadY = 1.0;
            let velocidadX = (Math.random() - 0.5) * 1.0;
            let ultimoPinColisionado = null;

            let animacion = setInterval(() => {
                y += velocidadY;
                x += velocidadX;
                velocidadY += 0.22; // Gravedad

                // Rebordes laterales suaves
                if (x < 10 || x > 410) {
                    velocidadX *= -0.2; 
                    x = Math.max(10, Math.min(410, x));
                }

                // Colisión con los pines (rebote sutil y suave)
                pins.forEach(pin => {
                    let distancia = Math.hypot(x - pin.x, y - pin.y);
                    if (distancia < 12 && pin !== ultimoPinColisionado) {
                        let direccionX = (x >= pin.x) ? 1 : -1;
                        velocidadX = direccionX * (Math.abs(velocidadX) * 0.5 + 0.5);
                        velocidadY = -velocidadY * 0.15; 
                        
                        ultimoPinColisionado = pin;
                    } else if (distancia >= 14 && pin === ultimoPinColisionado) {
                        ultimoPinColisionado = null;
                    }
                });

                // Posicionar bola en pantalla
                bolaEl.style.left = `${x}px`;
                bolaEl.style.top = `${y}px`;

                // Comprobar llegada abajo
                if (y >= 475) {
                    clearInterval(animacion);
                    calcularResultado(x, bolaEl);
                }
            }, 20);
        }

        function calcularResultado(xFinal, bolaEl) {
            let anchoRanura = 420 / 7;
            let indiceRanura = Math.floor(xFinal / anchoRanura);
            indiceRanura = Math.max(0, Math.min(6, indiceRanura));

            let mult = multiplicadores[indiceRanura];
            let premio = apuestaActual * mult;

            saldo += premio;
            actualizarSaldoUI();

            document.getElementById('info-estado').textContent = `¡Bola en x${mult}! Ganaste $${premio}`;

            bolaEl.remove();
        }
    </script>
</body>
</html>
