<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pachinko - aldGAME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Panel Lateral */
        .panel-lateral {
            width: 320px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        .panel-lateral h2 {
            font-size: 1.4rem;
            color: #e94560;
            margin-bottom: 6px;
        }

        .info-estado {
            font-size: 0.9rem;
            background: #2b2b2b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Caja de Dinero propia del Pachinko */
        .caja-saldo {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        .caja-saldo span {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .caja-saldo strong {
            font-size: 1.4rem;
            color: #f1c40f;
        }

        /* Selector de Apuesta */
        .selector-apuesta {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .selector-apuesta span {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .botones-apuesta {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-apuesta {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-apuesta.activo {
            background: #e94560;
            border-color: #e94560;
        }

        /* Contenedor principal del juego (Centrado absoluto) */
        .contenedor-juego {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 15px;
        }

        /* Tablero Pachinko */
        .tablero-pachinko {
            position: relative;
            width: 420px;
            height: 520px;
            background-color: #181818;
            border: 3px solid #0f3460;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #e94560;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Estilo de Bola Metálica Realista */
        .bola {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 4px 4px, #ffffff, #aaaaaa 40%, #444444 80%, #111111 100%);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.7);
            transform: translate(-50%, -50%);
        }

        .ranuras {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            display: flex;
            background: #111;
            border-top: 2px solid #333;
        }

        .ranura {
            flex: 1;
            border-right: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Colores llamativos para cada multiplicador */
        .ranura-10 { color: #f1c40f; background: rgba(241, 196, 15, 0.15); } /* Amarillo Dorado */
        .ranura-5  { color: #2ecc71; background: rgba(46, 204, 113, 0.15); } /* Verde Neón */
        .ranura-2  { color: #3498db; background: rgba(52, 152, 219, 0.15); } /* Azul Brillante */
        .ranura-1  { color: #e74c3c; background: rgba(231, 76, 60, 0.15); }  /* Rojo Intenso */

        /* Botones */
        .botones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #cf3a53;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .btn-volver {
            background-color: #444;
        }

        .btn-volver:hover {
            background-color: #555;
        }

        .btn-monedas {
            background-color: #27ae60;
        }
        .btn-monedas:hover {
            background-color: #219653;
        }
    </style>

<body>

    <!-- Panel Lateral -->
    <div class="panel-lateral">
        <div>
            <h2>Pachinko aldGAME</h2>
            <div class="info-estado" id="info-estado">¡Selecciona apuesta y lanza!</div>

            <!-- Caja de Dinero propia del Pachinko -->
            <div class="caja-saldo">
                <span>Dinero de Pachinko</span>
                <strong id="saldo-actual">$1000</strong>
            </div>

            <!-- Selector de Apuesta -->
            <div class="selector-apuesta">
                <span>Apuesta por bola</span>
                <div class="botones-apuesta">
                    <button class="btn-apuesta activo" onclick="cambiarApuesta(10)">$10</button>
                    <button class="btn-apuesta" onclick="cambiarApuesta(25)">$25</button>
                    <button class="btn-apuesta" onclick="cambiarApuesta(50)">$50</button>
                    <button class="btn-apuesta" onclick="cambiarApuesta(100)">$100</button>
                </div>
            </div>

            <div class="historial-bolas">
                <h3>Últimas bolas</h3>
                <div class="chips-historial" id="chips-historial"><span class="vacio-h">Aún no has lanzado</span></div>
            </div>
        </div>

        <div class="botones">
            <button class="btn btn-monedas" onclick="resetearMonedas()">🎁 Dar 1000 Monedas</button>
            <a href="../index.html" class="btn btn-volver">Volver al Menú</a>
        </div>
    </div>

    <!-- Contenedor del Juego -->
    <div class="contenedor-juego">
        <div class="tablero-pachinko" id="tablero">
            <div class="lanzador"></div>
            <div class="ranuras">
                <div class="ranura ranura-10">x10</div>
                <div class="ranura ranura-5">x5</div>
                <div class="ranura ranura-2">x2</div>
                <div class="ranura ranura-1">x1</div>
                <div class="ranura ranura-2">x2</div>
                <div class="ranura ranura-5">x5</div>
                <div class="ranura ranura-10">x10</div>
            </div>
        </div>
        <button class="btn" id="btn-lanzar" onclick="lanzarBola()" style="width: 420px; padding: 12px;">Lanzar Bola</button>
    </div>

    <script>
        // Sistema de Dinero independiente exclusivo para Pachinko
        let saldo = parseInt(localStorage.getItem('pachinko_dinero'));
        if (isNaN(saldo)) {
            saldo = 1000;
            localStorage.setItem('pachinko_dinero', saldo);
        }

        // Formato compacto: 1.5K, 2.3M, 4B...
        function formatoCompacto(n) {
            const signo = n < 0 ? '-' : '';
            n = Math.abs(n);
            const unidades = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
            let i = 0;
            while (n >= 1000 && i < unidades.length - 1) { n /= 1000; i++; }
            if (i === 0) return signo + Math.floor(n);
            return signo + (Math.floor(n * 100 + 1e-9) / 100) + unidades[i];
        }
        function formatoDinero(n) {
            const t = formatoCompacto(n);
            return t.startsWith('-') ? '-$' + t.slice(1) : '$' + t;
        }

        let apuestaActual = 10;
        const APUESTA_MINIMA = 10;

        function actualizarSaldoUI() {
            const elSaldo = document.getElementById('saldo-actual');
            elSaldo.textContent = formatoDinero(saldo);
            elSaldo.title = '$' + saldo.toLocaleString('es-ES');
            localStorage.setItem('pachinko_dinero', saldo);
        }
        actualizarSaldoUI();

        // Solo se puede reclamar cuando no te queda saldo y no hay bolas en juego
        function resetearMonedas() {
            const estado = document.getElementById('info-estado');
            if (bolas.length > 0) {
                estado.textContent = "⚠️ Espera a que caigan todas las bolas.";
                return;
            }
            if (saldo >= APUESTA_MINIMA) {
                estado.textContent = "⚠️ Solo puedes reclamar monedas cuando te quedas sin saldo.";
                return;
            }
            saldo = 1000;
            actualizarSaldoUI();
            estado.textContent = "✨ ¡Saldo reiniciado a $1000!";
        }

        function cambiarApuesta(valor) {
            apuestaActual = valor;
            document.querySelectorAll('.btn-apuesta').forEach(btn => {
                btn.classList.remove('activo');
                if (parseInt(btn.textContent.replace('$', '')) === valor) {
                    btn.classList.add('activo');
                }
            });
        }

        /* ================= FÍSICA ================= */
        const ANCHO = 420, R_BOLA = 7, R_PIN = 5, SLOTS = 7, Y_FIN = 475;
        const FISICA = { sep: 42, filas: 10, y0: 60, dy: 38, g: 0.22, drag: 0.995, dragx: 0.93,
                         e: 0.3, ruido: 0.3, jx: 6, vx0: 0.6, k: 0.006, yGuia: 100 };
        const multiplicadores = [10, 5, 2, 1, 2, 5, 10];

        // Probabilidad (%) de que cada ranura sea la "elegida" para la bola.
        // x10 = 1.5% + 1.5% = 3% (aprox. 1 de cada 33 bolas). Es difícil, pero posible.
        const PESOS = [1.5, 6, 15, 55, 15, 6, 1.5];

        function elegirRanura() {
            let r = Math.random() * 100;
            for (let i = 0; i < PESOS.length; i++) {
                if (r < PESOS[i]) return i;
                r -= PESOS[i];
            }
            return 3;
        }

        const tablero = document.getElementById('tablero');
        const ranurasEls = document.querySelectorAll('.ranura');
        const pins = [];

        // Rejilla de pines escalonada que cubre todo el ancho
        function generarPines() {
            const S = FISICA.sep;
            for (let r = 0; r < FISICA.filas; r++) {
                const off = (r % 2) ? S / 2 : 0;
                const n = Math.floor((ANCHO - off) / S) + 1;
                for (let k = 0; k < n; k++) {
                    const x = off + k * S;
                    if (x < 8 || x > ANCHO - 8) continue;
                    const y = FISICA.y0 + r * FISICA.dy;
                    const el = document.createElement('div');
                    el.classList.add('pin');
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                    tablero.appendChild(el);
                    pins.push({ x, y });
                }
            }
        }
        generarPines();

        function pasoFisica(b) {
            const F = FISICA;
            // Guiado suave hacia la ranura elegida (aumenta al bajar)
            const guia = Math.min(1, Math.max(0, (b.y - F.yGuia) / (Y_FIN - F.yGuia)));
            b.vx += F.k * guia * (b.tx - b.x);

            b.vy += F.g;
            b.vx *= F.dragx;
            b.vy *= F.drag;
            b.x += b.vx;
            b.y += b.vy;

            if (b.x < R_BOLA) { b.x = R_BOLA; b.vx = Math.abs(b.vx) * 0.4; }
            if (b.x > ANCHO - R_BOLA) { b.x = ANCHO - R_BOLA; b.vx = -Math.abs(b.vx) * 0.4; }

            const lim = R_BOLA + R_PIN;
            for (const p of pins) {
                if (Math.abs(b.y - p.y) > lim || Math.abs(b.x - p.x) > lim) continue;
                let dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
                if (d < lim) {
                    if (d < 0.001) { dx = Math.random() - 0.5; dy = -1; d = Math.hypot(dx, dy); }
                    const nx = dx / d, ny = dy / d;
                    b.x = p.x + nx * lim;
                    b.y = p.y + ny * lim;
                    const vn = b.vx * nx + b.vy * ny;
                    if (vn < 0) {
                        b.vx -= (1 + F.e) * vn * nx;
                        b.vy -= (1 + F.e) * vn * ny;
                        b.vx += (Math.random() * 2 - 1) * F.ruido;
                    }
                }
            }
            // Por si una bola se queda atascada sobre un pin
            b.pasos++;
            if (b.pasos > 600) b.vx += (Math.random() - 0.5) * 0.4;
        }

        /* ================= BOLAS ================= */
        let bolas = [];
        let ultimoT = 0, acumulado = 0, bucleActivo = false;
        const PASO_MS = 1000 / 60;

        function lanzarBola() {
            if (saldo < apuestaActual) {
                document.getElementById('info-estado').textContent = "⚠️ ¡No tienes suficiente dinero en Pachinko!";
                return;
            }

            saldo -= apuestaActual;
            actualizarSaldoUI();

            const el = document.createElement('div');
            el.classList.add('bola');
            tablero.appendChild(el);

            bolas.push({
                el,
                apuesta: apuestaActual,              // la apuesta queda fijada al lanzar
                tx: (elegirRanura() + 0.5) * (ANCHO / SLOTS),
                x: ANCHO / 2 + (Math.random() * 2 - 1) * FISICA.jx,
                y: 15,
                vx: (Math.random() * 2 - 1) * FISICA.vx0,
                vy: 0.8,
                pasos: 0
            });

            document.getElementById('info-estado').textContent = "🎱 ¡Bola en juego!";
            if (!bucleActivo) {
                bucleActivo = true;
                ultimoT = 0; acumulado = 0;
                requestAnimationFrame(bucle);
            }
        }

        function bucle(t) {
            if (!ultimoT) ultimoT = t;
            acumulado += Math.min(100, t - ultimoT);
            ultimoT = t;

            while (acumulado >= PASO_MS) {
                acumulado -= PASO_MS;
                const terminadas = [];
                for (const b of bolas) {
                    pasoFisica(b);
                    if (b.pasos % 3 === 0) crearEstela(b.x, b.y);
                    if (b.y >= Y_FIN) terminadas.push(b);
                }
                for (const b of terminadas) {
                    bolas = bolas.filter(o => o !== b);
                    aterrizar(b);
                }
            }

            for (const b of bolas) {
                b.el.style.left = `${b.x}px`;
                b.el.style.top = `${b.y}px`;
            }

            if (bolas.length > 0) {
                requestAnimationFrame(bucle);
            } else {
                bucleActivo = false;
            }
        }

        function crearEstela(x, y) {
            const e = document.createElement('div');
            e.className = 'estela';
            e.style.left = `${x}px`;
            e.style.top = `${y}px`;
            e.addEventListener('animationend', () => e.remove());
            tablero.appendChild(e);
        }

        function aterrizar(b) {
            const anchoRanura = ANCHO / SLOTS;
            const idx = Math.max(0, Math.min(SLOTS - 1, Math.floor(b.x / anchoRanura)));
            const mult = multiplicadores[idx];
            const premio = b.apuesta * mult;

            saldo += premio;
            actualizarSaldoUI();
            b.el.remove();

            document.getElementById('info-estado').textContent = (mult === 10)
                ? `🔥 ¡¡JACKPOT x10!! Ganaste ${formatoDinero(premio)}`
                : `¡Bola en x${mult}! Ganaste ${formatoDinero(premio)}`;

            // Efecto en la ranura
            const r = ranurasEls[idx];
            r.classList.remove('golpe'); void r.offsetWidth; r.classList.add('golpe');

            // Premio flotante
            const colores = { 1: '#ff8a9a', 2: '#7cc4ff', 5: '#5dffa8', 10: '#ffe07a' };
            const pop = document.createElement('div');
            pop.className = 'premio-flotante';
            pop.style.left = `${(idx + 0.5) * anchoRanura}px`;
            pop.style.color = colores[mult];
            pop.textContent = `+${formatoDinero(premio)}`;
            pop.addEventListener('animationend', () => pop.remove());
            tablero.appendChild(pop);

            anadirHistorial(mult);
        }

        function anadirHistorial(mult) {
            const cont = document.getElementById('chips-historial');
            const vacio = cont.querySelector('.vacio-h');
            if (vacio) vacio.remove();
            const chip = document.createElement('span');
            chip.className = `chip-h m${mult}`;
            chip.textContent = `x${mult}`;
            cont.prepend(chip);
            while (cont.children.length > 14) cont.lastChild.remove();
        }
    </script>
</body>
</html>
