<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ajedrez - NexGame</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg1:#3a1a33;--bg2:#140a14;--card:#2a1428;--line:#5c2f4f;--acc:#f08a3e;--txt:#f4e3ee}
body[data-t="gothic"]{--bg1:#1c1626;--bg2:#08060c;--card:#16111e;--line:#3d2f52;--acc:#ff4d54;--txt:#eee8f4}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--txt);background:radial-gradient(ellipse at 50% 0%,var(--bg1),var(--bg2) 75%) fixed}
#app{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:12px;min-height:100vh}
#boardBox{position:relative}
canvas#cv{display:block;image-rendering:pixelated;touch-action:manipulation;border-radius:6px}
#side{width:290px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px #0008}
#status{font-size:18px;font-weight:bold;text-align:center;padding:8px;background:#0003;border-radius:8px;border:1px solid var(--line);min-height:42px;display:flex;align-items:center;justify-content:center}
#status.chk{color:#ff6b6b}
.capRow{display:flex;align-items:center;gap:6px;min-height:30px;background:#0003;border-radius:8px;padding:3px 6px;flex-wrap:wrap}
.capRow small{opacity:.7;min-width:62px;font-size:12px}.capRow b{margin-left:auto;color:var(--acc)}
.capRow canvas{image-rendering:pixelated;margin-right:-6px}
#moves{height:150px;overflow:auto;background:#0003;border-radius:8px;padding:6px 8px;font-size:14px;font-family:Consolas,monospace;border:1px solid var(--line)}
#moves div{display:flex;gap:6px}#moves span{width:20px;opacity:.5}#moves em{font-style:normal;width:64px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:inherit;font-size:15px;color:var(--txt);background:linear-gradient(#4a2744,#35192f);border:2px solid var(--line);border-bottom-width:4px;border-radius:9px;padding:8px;cursor:pointer}
body[data-t="gothic"] button{background:linear-gradient(#2c2340,#1d1630)}
button:hover{filter:brightness(1.25)}button:active{transform:translateY(2px);border-bottom-width:2px}
button.main{background:linear-gradient(var(--acc),#c95f1a);color:#2a1000;font-weight:bold;border-color:#7a3a10}
body[data-t="gothic"] button.main{background:linear-gradient(#ff6a70,#c9242c);color:#fff;border-color:#6d1015}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px;min-width:min(92vw,340px);text-align:center;box-shadow:0 20px 60px #000}
.card h2{margin:6px 0 14px;font-size:26px;letter-spacing:1px}
.row{margin:10px 0;text-align:left;font-size:13px;opacity:.9}
.seg{display:flex;gap:6px;margin-top:4px}.seg button{flex:1;padding:7px 4px;font-size:13px}
.seg button.on{background:linear-gradient(var(--acc),#c95f1a);color:#2a1000;font-weight:bold}
body[data-t="gothic"] .seg button.on{background:linear-gradient(#ff6a70,#c9242c);color:#fff}
#banner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000a;border-radius:6px;gap:10px;z-index:5;text-align:center;padding:10px}
#banner h2{margin:0;font-size:30px;color:var(--acc);text-shadow:0 0 18px var(--acc);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#banner canvas{image-rendering:pixelated;animation:bob 1.4s ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes bob{50%{transform:translateY(-8px)}}
#promo .pb{display:inline-block;margin:6px;padding:8px 10px}
.cred{font-size:11px;opacity:.55;text-align:center}
@media(max-width:760px){#app{flex-direction:column;align-items:center;padding:6px}#side{width:min(96vw,520px)}#moves{height:90px}}
</style></head><body data-t="classic">
<div id="app">
 <div id="boardBox"><canvas id="cv"></canvas><div id="banner"><canvas id="bk"></canvas><h2 id="bt"></h2><div id="bs" style="opacity:.85"></div><button class="main" onclick="showMenu()">Jugar otra vez</button></div></div>
 <div id="side">
  <div id="status"></div>
  <div class="capRow" id="capB"><small>Blancas</small><span id="cB"></span><b id="dB"></b></div>
  <div class="capRow" id="capN"><small>Negras</small><span id="cN"></span><b id="dN"></b></div>
  <div id="moves"></div>
  <div class="btns"><button onclick="undo()">↶ Deshacer</button><button onclick="flip()">⟲ Girar</button><button onclick="toggleMute()" id="mu">🔊 Sonido</button><button class="main" onclick="showMenu()">☰ Nueva</button></div>
  <div class="cred">Arte de las piezas: NullTale (@NullTale)</div>
 </div>
</div>

 <div class="row" id="rDif">Dificultad<div class="seg" id="sDif"><button data-v="1">Fácil</button><button data-v="2">Normal</button><button data-v="3">Difícil</button></div></div>
 <div class="row">Estilo<div class="seg" id="sThe"><button data-v="classic">Clásico</button><button data-v="gothic">Gótico</button></div></div>
