<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suika Game - NexGame</title>
    <style>
        :root {
            --nx-bg: #1a1c23;
            --nx-surface: #24283b;
            --nx-text: #c0caf5;
            --nx-accent: #f7768e;
            --nx-yellow: #e0af68;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--nx-bg);
            color: var(--nx-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-layout {
            display: flex;
            gap: 30px;
            align-items: center;
            background: var(--nx-surface);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #414868;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 180px;
        }

        .bubble-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
        }

        .bubble-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--nx-yellow);
            letter-spacing: 1px;
        }

        .bubble-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #canvas-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #e0af68;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .btn-volver {
            margin-top: 15px;
            background: var(--nx-accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }

        .btn-volver:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
    <!-- Matter.js para las físicas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div class="game-layout">
        <!-- Panel Izquierdo: Puntuación y Next -->
        <div class="sidebar">
            <div class="bubble-card">
                <h3>Puntuación</h3>
                <div class="value" id="score">0</div>
            </div>
            <div class="bubble-card">
                <h3>Siguiente</h3>
                <div style="height: 70px; display: flex; align-items: center; justify-content: center;" id="next-preview">
                    <!-- Vista previa dibujada por JS -->
                </div>
            </div>
            <a href="../index.html" class="btn-volver">← Volver al Menú</a>
        </div>

        <!-- Contenedor del Juego -->
        <div class="main-container">
            <div id="canvas-container"></div>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;

        const anchoCanvas = 400;
        const altoCanvas = 600;

        // Configuración de las frutas (Niveles del 0 al 10)
        const frutasConfig = [
            { radius: 14, color: '#ff5c5c', name: 'Cereza', score: 2 },
            { radius: 20, color: '#ff7eb9', name: 'Fresa', score: 4 },
            { radius: 27, color: '#ffa857', name: 'Uva', score: 8 },
            { radius: 35, color: '#ffd166', name: 'Decopon', score: 16 },
            { radius: 44, color: '#06d6a0', name: 'Persimón', score: 32 },
            { radius: 54, color: '#118ab2', name: 'Manzana', score: 64 },
            { radius: 65, color: '#073b4c', name: 'Pera', score: 128 },
            { radius: 78, color: '#8338ec', name: 'Melocotón', score: 256 },
            { radius: 92, color: '#3a86ff', name: 'Piña', score: 512 },
            { radius: 108, color: '#fb5607', name: 'Melón', score: 1024 },
            { radius: 125, color: '#2ec4b6', name: 'Sandía', score: 2048 }
        ];

        let engine = Engine.create();
        let world = engine.world;

        let render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: {
                width: anchoCanvas,
                height: altoCanvas,
                wireframes: false,
                background: '#161821'
            }
        });

        Render.run(render);
        let runner = Runner.create();
        Runner.run(runner, engine);

        // Crear límites del frasco
        let ground = Bodies.rectangle(anchoCanvas / 2, altoCanvas - 10, anchoCanvas, 20, { isStatic: true, render: { fillStyle: '#292e42' } });
        let wallLeft = Bodies.rectangle(10, altoCanvas / 2, 20, altoCanvas, { isStatic: true, render: { fillStyle: '#292e42' } });
        let wallRight = Bodies.rectangle(anchoCanvas - 10, altoCanvas / 2, 20, altoCanvas, { isStatic: true, render: { fillStyle: '#292e42' } });
        
        Composite.add(world, [ground, wallLeft, wallRight]);

        let score = 0;
        let frutaActualNivel = Math.floor(Math.random() * 4);
        let frutaSiguienteNivel = Math.floor(Math.random() * 4);
        let posXControl = anchoCanvas / 2;
        let puedeSoltar = true;

        // Control de posición superior con el ratón
        const containerEl = document.getElementById('canvas-container');
        containerEl.addEventListener('mousemove', (e) => {
            const rect = render.canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let radioActual = frutasConfig[frutaActualNivel].radius;
            if (x < radioActual + 15) x = radioActual + 15;
            if (x > anchoCanvas - radioActual - 15) x = anchoCanvas - radioActual - 15;
            posXControl = x;
        });

        // Soltar fruta al hacer clic
        containerEl.addEventListener('click', () => {
            if (!puedeSoltar) return;
            puedeSoltar = false;

            let config = frutasConfig[frutaActualNivel];
            let fruta = Bodies.circle(posXControl, 60, config.radius, {
                restitution: 0.2,
                friction: 0.1,
                render: { fillStyle: config.color },
                label: `fruta-${frutaActualNivel}`
            });
            fruta.fruitLevel = frutaActualNivel;

            Composite.add(world, fruta);

            // Siguiente fruta
            frutaActualNivel = frutaSiguienteNivel;
            frutaSiguienteNivel = Math.floor(Math.random() * 4);

            setTimeout(() => {
                puedeSoltar = true;
            }, 400);
        });

        // Lógica estricta de colisión y fusión
        Events.on(engine, 'collisionStart', (event) => {
            let pairs = event.pairs;

            pairs.forEach(pair => {
                let bodyA = pair.bodyA;
                let bodyB = pair.bodyB;

                if (bodyA.label && bodyA.label.startsWith('fruta-') &&
                    bodyB.label && bodyB.label.startsWith('fruta-')) {

                    let nivelA = bodyA.fruitLevel;
                    let nivelB = bodyB.fruitLevel;

                    if (nivelA === nivelB && nivelA < frutasConfig.length - 1) {
                        if (bodyA.isRemoved || bodyB.isRemoved) return;
                        bodyA.isRemoved = true;
                        bodyB.isRemoved = true;

                        let posX = (bodyA.position.x + bodyB.position.x) / 2;
                        let posY = (bodyA.position.y + bodyB.position.y) / 2;

                        Composite.remove(world, [bodyA, bodyB]);

                        let nuevoNivel = nivelA + 1;
                        let configNue = frutasConfig[nuevoNivel];

                        let nuevaFruta = Bodies.circle(posX, posY, configNue.radius, {
                            restitution: 0.2,
                            friction: 0.1,
                            render: { fillStyle: configNue.color },
                            label: `fruta-${nuevoNivel}`
                        });
                        nuevaFruta.fruitLevel = nuevoNivel;

                        Composite.add(world, nuevaFruta);

                        score += configNue.score;
                        document.getElementById('score').innerText = score;
                    }
                }
            });
        });

        // Renderizado personalizado para caras kawaii y línea guía superior
        Events.on(render, 'afterRender', () => {
            let context = render.context;

            // Dibujar línea guía superior
            context.beginPath();
            context.setLineDash([4, 4]);
            context.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            context.lineWidth = 2;
            context.moveTo(posXControl, 50);
            context.lineTo(posXControl, altoCanvas - 30);
            context.stroke();
            context.setLineDash([]);

            // Dibujar fruta flotante en la parte superior lista para soltar
            let configActual = frutasConfig[frutaActualNivel];
            context.beginPath();
            context.arc(posXControl, 45, configActual.radius, 0, 2 * Math.PI);
            context.fillStyle = configActual.color;
            context.fill();
            context.lineWidth = 2;
            context.strokeStyle = '#fff';
            context.stroke();

            // Dibujar carita kawaii simple en la fruta superior
            context.fillStyle = '#fff';
            context.fillRect(posXControl - 5, 40, 3, 5);
            context.fillRect(posXControl + 3, 40, 3, 5);
        });
    </script>
</body>
</html>
